name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build theme zip
        run: |
          THEME_NAME="theme-aiym"
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="${THEME_NAME}-v${VERSION}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x ".gitignore"
          echo "构建完成: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Prepare release notes
        id: notes
        run: |
          VER="${{ steps.version.outputs.VERSION }}"
          {
            echo "NOTES<<EOF"
            echo "## AIYM-启梦 v${VER}"
            echo ""
            echo "### 🖼️ 随机封面(本轮)"
            echo "- 首页文章卡&资源推荐卡: 同一内容 2h 窗口内固定同一张, 跨窗口自动换图"
            echo "- 同一窗口内不同内容封面互不重复(优先分配可用图, 图池用尽才复用)"
            echo "- 修复 photo 插件缺失时首页/资源页 500(photoFinder 判空)"
            echo ""
            echo "### 🧭 交互(v1.1.1)"
            echo "- 文章详情返回恢复原列表位置, 返回时禁用入场动画防闪烁"
            echo "- 刷新/tabbar 跳转回顶, 不再残留旧滚动位置"
            echo ""
            echo "### 🎨 卡片(v1.1.1)"
            echo "- 首页文章卡封面完整展示(不再 112px 裁切)"
            echo "- 简介到阅读量间距 20px→4px, 卡片更紧凑"
            echo ""
            echo "### 移动端体验"
            echo "- 底部 Tabbar 液态玻璃化: 单层玻璃大胶囊(毛玻璃+渐变+圆角), 选中项灰色玻璃高亮铺满整个 tab 格、无边框无嵌套"
            echo "- 移动端页脚间距统一: 移除 flex 撑底, 各页页脚紧贴正文"
            echo "- 首屏内容优化: 资源/工具箱/关于页 hero 压缩, 露出更多真实内容"
            echo "- 首页文章卡移动端紧凑化"
            echo "- tabbar 公共变量收敛: --tab-* / --glass-*"
            echo ""
            echo "### 新特性"
            echo "- 布局契约重构: 根级 layout.html, 17 页面统一迁移"
            echo "- 分类切换改为下划线 Tab, 分类栏吸顶"
            echo "- 资源推荐卡恢复阅读量"
            echo ""
            echo "### 修复"
            echo "- 横滑卡「滑动后首次点击不跳转」"
            echo "- 首页推荐末张裁剪"
            echo "- bfcache 滚动恢复逻辑"
            echo ""
            echo "### 安装"
            echo "1. 下载 theme-aiym-v${VER}.zip 并在 Halo 后台安装主题"
            echo ""
            echo "### 链接"
            echo "- 主页: https://www.aiym.fun"
            echo "- 文档: https://github.com/myaiym/theme-aiym#readme"
            echo "- 反馈: https://github.com/myaiym/theme-aiym/issues"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: theme-aiym-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}