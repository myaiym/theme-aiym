name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build theme zip
        run: |
          THEME_NAME="theme-aiym"
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="${THEME_NAME}-v${VERSION}.zip"

          # 排除不需要的文件
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x ".gitignore"

          echo "📦 构建完成: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          cat << 'EOF' > release_notes.md
          ## AIYM-启梦 v${VERSION}

          ### ✨ 新特性
          - 布局契约重构：根级 layout.html，17 页面统一迁移校验，兼容 Halo 2.19+
          - 分类切换改为应用商店式「下划线 Tab」：首页 / 资源 / 工具统一
          - 分类/资源栏 sticky 吸顶 + 背景色，下方内容独立滚动
          - 资源推荐卡恢复阅读量显示（热度标识）
          - 全局字号变量，统一资源/工具页标题层级字体

          ### 🎨 交互 & 视觉
          - 详情页（文章/资源）、搜索弹窗 Apple 化（圆角、毛玻璃、入场动画）
          - 首页热文 / 资源推荐移动端横向滑动优化
          - Hero 图标统一尺寸，修复与文字对齐
          - 适配 prefers-reduced-motion

          ### 🐛 修复
          - 横滑卡「滑动后首次点击不跳转」修复
          - 首页推荐末张裁剪 修复
          - bfcache 滚动恢复逻辑优化

          ### 🧹 清理
          - 删除未使用模板 post_resource / category_resources

          ### 📦 安装
          1. 下载下方 `theme-aiym-v*.zip`
          2. Halo 后台 → 外观 → 主题 → 安装主题
          3. 上传 zip 文件，等待安装完成
          4. 启用主题

          ### 🔗 相关链接
          - 主页: https://www.aiym.fun
          - 文档: https://github.com/myaiym/theme-aiym#readme
          - 反馈: https://github.com/myaiym/theme-aiym/issues
          EOF

          # 替换版本号
          sed -i "s/\${VERSION}/${VERSION}/g" release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            theme-aiym-v*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
