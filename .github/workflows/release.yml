name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build theme zip
        run: |
          THEME_NAME="theme-aiym"
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="${THEME_NAME}-v${VERSION}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x ".gitignore"
          echo "构建完成: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Prepare release notes
        id: notes
        run: |
          VER="${{ steps.version.outputs.VERSION }}"
          {
            echo "NOTES<<EOF"
            echo "## AIYM-启梦 v${VER}"
            echo ""
            echo "### 新增"
            echo "- 桌面主菜单按真实可用宽度将末尾项目收进「•••」；移动端超过 4 项时保留前 4 项，第 5 格为「更多」。"
            echo "- 首页、资源中心与工具箱支持移动端内容区横滑切换分类；热门 / 推荐横滑卡仍保持原生滚动。"
            echo "- 工具箱新增网络测速、图片压缩、ITDOG 三个默认外部实用链接，可在主题设置中编辑或删除。"
            echo ""
            echo "### 优化"
            echo "- 首页分类加载与资源中心统一为骨架屏，数据就绪后一次替换；移动端固定头部和底部菜单在切换时保持稳定。"
            echo "- 移动端头部操作区和液态玻璃 Tabbar 重新精简，选中项采用低对比灰玻璃效果。"
            echo "- 新安装说明补充主菜单、文章分类、资源中心、工具箱、关于页以及插件页面的配置边界。"
            echo "- 主题商城截图更新为当前实际首页。"
            echo ""
            echo "### 修复"
            echo "- 修复热门文章 / 热门资源横滑时误触发分类切换的问题。"
            echo ""
            echo "### 安装"
            echo "1. 下载 theme-aiym-v${VER}.zip 并在 Halo 后台安装主题。"
            echo ""
            echo "### 链接"
            echo "- 主页: https://www.aiym.fun"
            echo "- 文档: https://github.com/myaiym/theme-aiym#readme"
            echo "- 反馈: https://github.com/myaiym/theme-aiym/issues"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: theme-aiym-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}