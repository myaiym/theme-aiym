name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build theme zip
        run: |
          THEME_NAME="theme-aiym"
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="${THEME_NAME}-v${VERSION}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x ".gitignore"
          echo "构建完成: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Prepare release notes
        id: notes
        run: |
          VER="${{ steps.version.outputs.VERSION }}"
          {
            echo "NOTES<<EOF"
            echo "## AIYM-启梦 v${VER}"
            echo ""
            echo "### 全局导航与聚合页"
            echo "- 桌面导航升级为居中玻璃轨道，适配中小桌面宽度并保留高对比度降级"
            echo "- 首页与资源页分类栏融入页面背景、全宽吸附，优化分类与内容区的间距层级"
            echo "- 首页、资源、工具箱采用流式内容容器；首页/资源首屏加入克制的初始化动效"
            echo "- 修复 PJAX 连续详情页返回列表时的重复滚动校正闪动，保留滚动位置恢复"
            echo ""
            echo "### 文章详情与资源"
            echo "- 正文图片恢复 Halo 编辑器设定的百分比尺寸与段落对齐，并限制不超出阅读区"
            echo "- 代码块复制按钮固定在横向滚动区域外，支持图标、复制反馈与 HTTP 降级复制"
            echo "- 图片预览关闭按钮固定于视口右上，修复 SVG 图标显示与点击关闭"
            echo "- 上一篇/下一篇接入 PJAX；仅有一篇时自动铺满，移动端压缩重复操作文案"
            echo "- 无封面详情页不再输出空图片请求；正文阅读区收至舒适行宽，资源操作区保持流式"
            echo ""
            echo "### 工具箱与移动端"
            echo "- 统一工具详情页活动 Tab 对比度、底部安全距离与触控尺寸"
            echo "- 优化 JSON、Markdown、二维码、Swagger 等工具的窄屏布局、操作换行与内容区"
            echo ""
            echo "### 兼容与维护"
            echo "- 公共 CSS/JS 使用版本查询参数发布，兼容 Halo 的长期静态资源缓存"
            echo ""
            echo "### 安装"
            echo "1. 下载 theme-aiym-v${VER}.zip 并在 Halo 后台安装主题"
            echo ""
            echo "### 链接"
            echo "- 主页: https://www.aiym.fun"
            echo "- 文档: https://github.com/myaiym/theme-aiym#readme"
            echo "- 反馈: https://github.com/myaiym/theme-aiym/issues"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: theme-aiym-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}