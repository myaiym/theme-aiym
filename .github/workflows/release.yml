name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build theme zip
        run: |
          THEME_NAME="theme-aiym"
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="${THEME_NAME}-v${VERSION}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x ".gitignore"
          echo "构建完成: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Prepare release notes
        id: notes
        run: |
          VER="${{ steps.version.outputs.VERSION }}"
          {
            echo "NOTES<<EOF"
            echo "## AIYM-启梦 v${VER}"
            echo ""
            echo "### 移动端交互"
            echo "- 全站移除浏览器蓝色点击高亮，统一为轻量按压反馈"
            echo "- 主要操作按钮与分类 Tab 扩大到至少 44px 触控目标"
            echo "- 克制卡片阴影、缩放和批量入场动画，减少滑动与点击干扰"
            echo "- 保持单层液态玻璃 Duck 底栏及灰色选中态"
            echo ""
            echo "### 页面体验"
            echo "- 首页、资源、工具箱和关于页统一辅助文字对比度与 Apple 风格细节"
            echo "- 资源、工具箱和关于页 Emoji 替换为稳定的线性图标"
            echo "- 资源图标统一为连续圆角外形，列表卡改为细边框层级"
            echo "- 关于页公众号、网站和邮箱增加明确的整行点击及实心操作按钮"
            echo "- 各页正文到页脚统一为 50px，并保留 Duck 底栏安全距离"
            echo ""
            echo "### 无障碍与兼容"
            echo "- 完善分类 Tab、当前底栏项目及二维码弹窗的语义和键盘操作"
            echo "- 提升小字号品牌文字与辅助文字对比度"
            echo "- 增加减少透明度、高对比度和强制颜色模式降级"
            echo ""
            echo "### 安装"
            echo "1. 下载 theme-aiym-v${VER}.zip 并在 Halo 后台安装主题"
            echo ""
            echo "### 链接"
            echo "- 主页: https://www.aiym.fun"
            echo "- 文档: https://github.com/myaiym/theme-aiym#readme"
            echo "- 反馈: https://github.com/myaiym/theme-aiym/issues"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: theme-aiym-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}