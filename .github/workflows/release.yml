name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build theme zip
        run: |
          THEME_NAME="theme-aiym"
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="${THEME_NAME}-v${VERSION}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x ".gitignore"
          echo "构建完成: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Prepare release notes
        id: notes
        run: |
          VER="${{ steps.version.outputs.VERSION }}"
          {
            echo "NOTES<<EOF"
            echo "## AIYM-启梦 v${VER}"
            echo ""
            echo "### 新增"
            echo "- 工具箱外部工具支持「新标签页 / 当前页」跳转方式（默认新标签页）。"
            echo "- 顶部已登录用户信息条可点击进入后台（管理员经 super-role 判断进入 /console，普通用户 /uc）。"
            echo ""
            echo "### 优化"
            echo "- 首页文章卡与资源推荐卡封面真正随机：从图库随机挑选而非按顺序取，同一文章窗口内稳定、跨窗口更换、文章间不重复。"
            echo "- TOC 目录兼容正文使用 h1 标题的文章，避免不渲染目录。"
            echo "- 首页 / 资源 / 工具箱骨架屏视觉统一，适配系统减弱动态效果。"
            echo "- 分类与资源筛选切换时展示加载进度并锁定非激活项，避免误触。"
            echo "- 热门 / 推荐横滑拖拽更稳，移动端松手不误触跳转，桌面滚轮转横向滚动。"
            echo "- 关于页宽度与资源 / 工具箱统一为流式布局；资源详情图标置前、下载卡精简。"
            echo ""
            echo "### 修复"
            echo "- 修复正文使用 h1 标题的文章不生成目录。"
            echo "- 首页入场动画收拢到筛选区，避免真实列表在骨架后闪现。"
            echo ""
            echo "### 安装"
            echo "1. 下载 theme-aiym-v${VER}.zip 并在 Halo 后台安装主题。"
            echo ""
            echo "### 链接"
            echo "- 主页: https://www.aiym.fun"
            echo "- 文档: https://github.com/myaiym/theme-aiym#readme"
            echo "- 反馈: https://github.com/myaiym/theme-aiym/issues"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: theme-aiym-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}