name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build theme zip
        run: |
          THEME_NAME="theme-aiym"
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="${THEME_NAME}-v${VERSION}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x ".gitignore"
          echo "构建完成: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Prepare release notes
        id: notes
        run: |
          VER="${{ steps.version.outputs.VERSION }}"
          {
            echo "NOTES<<EOF"
            echo "## AIYM-启梦 v${VER}"
            echo ""
            echo "### feat"
            echo "- 统一分享面板：文章、工具列表和工具详情接入同一分享入口，支持系统分享与复制分享文案；HTTP 内网环境自动回退到复制。"
            echo "- PJAX 列表页缓存恢复：从首页、资源中心或工具箱进入详情并返回时，直接还原已加载的列表 DOM、横向卡片位置和垂直滚动位置。"
            echo ""
            echo "### fix"
            echo "- 修复 PJAX 点击全页蒙层：不再把 aria-busy 写到 body，避免导航期间页面整体变暗、不可操作。"
            echo "- 修复列表深处返回闪烁：避免重新请求动态列表、展示骨架并反复校正滚动位置造成的闪动。"
            echo "- 修复移动端 hover 状态粘滞：返回顶部、头部操作、导航和搜索弹窗等控件的 hover 视觉仅在鼠标设备启用。"
            echo "- 恢复返回顶部触屏反馈：按住时显示品牌蓝，松手后立即恢复默认外观。"
            echo "- 修复返回帧按压态残留：列表卡片在返回恢复时不再先缩小再弹回。"
            echo ""
            echo "### 安装"
            echo "1. 下载 theme-aiym-v${VER}.zip 并在 Halo 后台安装主题。"
            echo ""
            echo "### 链接"
            echo "- 主页: https://www.aiym.fun"
            echo "- 文档: https://github.com/myaiym/theme-aiym#readme"
            echo "- 反馈: https://github.com/myaiym/theme-aiym/issues"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: theme-aiym-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}