<!-- AIYM 统一分享面板：文章、资源与工具页共用 -->
<th:block th:fragment="share">
    <style>
    .aiym-share-wrap { position: relative; display: inline-flex; }
    .aiym-share-trigger { display:inline-flex; align-items:center; justify-content:center; gap:4px; min-height:28px; padding:5px 8px; border:0; border-radius:999px; background:rgba(var(--color-brand-rgb),.10); color:var(--color-brand-text); font:600 11px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:background .18s ease,transform .18s cubic-bezier(.2,.8,.2,1); }
    .aiym-share-trigger svg { display:block; width:14px; height:14px; flex:0 0 auto; stroke-width:2.25; }
    .aiym-share-trigger:active { transform:scale(.96); background:rgba(var(--color-brand-rgb),.18); }
    @media (hover:hover) and (pointer:fine) { .aiym-share-trigger:hover { background:rgba(var(--color-brand-rgb),.16); } }
    .aiym-share-trigger:focus-visible,.aiym-share-action:focus-visible,.aiym-share-close:focus-visible { outline:none; box-shadow:0 0 0 4px var(--color-brand-glow); }

    /* 桌面：从 body 顶层弹出的紧凑操作条，绕过工具卡片的 stacking context。 */
    .aiym-share-popover { position:fixed; z-index:2147483000; width:220px; overflow:hidden; border:1px solid rgba(var(--color-brand-rgb),.24); border-radius:16px; background:rgba(255,255,255,.94); box-shadow:0 14px 36px rgba(20,35,50,.16),0 1px 2px rgba(0,0,0,.08); backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%); }
    [data-theme="dark"] .aiym-share-popover { background:rgba(36,36,38,.94); border-color:rgba(var(--color-brand-rgb),.32); }
    .aiym-share-popover[hidden] { display:none; }
    .aiym-share-popover__head { display:flex; align-items:center; justify-content:space-between; padding:10px 10px 5px 12px; }
    .aiym-share-popover__title { color:var(--color-text-primary); font:650 13px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif; letter-spacing:-.01em; }
    .aiym-share-close { display:grid; place-items:center; width:24px; height:24px; border:0; border-radius:50%; background:rgba(120,120,128,.13); color:var(--color-text-secondary); font-size:17px; line-height:1; cursor:pointer; }
    .aiym-share-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; padding:0 8px 8px; }
    .aiym-share-action { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:5px; min-height:38px; padding:6px 7px; box-sizing:border-box; border:1px solid transparent; border-radius:10px; background:rgba(var(--color-brand-rgb),.10); color:var(--color-brand-text); text-decoration:none; font:600 11px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif; cursor:pointer; -webkit-tap-highlight-color:transparent; white-space:nowrap; transition:background .18s ease,transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s ease; }
    .aiym-share-action svg { display:block !important; width:16px !important; height:16px !important; flex:0 0 auto; color:var(--color-brand) !important; stroke:currentColor !important; stroke-width:2.2; }
    .aiym-share-action:active { transform:scale(.97); background:rgba(var(--color-brand-rgb),.20); }
    @media (hover:hover) and (pointer:fine) { .aiym-share-action:hover { border-color:rgba(var(--color-brand-rgb),.32); background:rgba(var(--color-brand-rgb),.16); } }
    .aiym-share-hint { margin:0; padding:0 12px 9px; color:var(--color-text-muted); font-size:10px; line-height:1.35; }
    .aiym-share-toast { position:fixed; z-index:2000; left:50%; top:calc(env(safe-area-inset-top,0px) + 18px); display:flex; align-items:center; gap:8px; max-width:calc(100vw - 40px); padding:11px 14px; border:1px solid rgba(255,255,255,.24); border-radius:999px; background:rgba(35,35,37,.92); color:#fff; box-shadow:0 8px 28px rgba(0,0,0,.24); font:600 13px/1.15 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif; transform:translate(-50%,-14px) scale(.96); opacity:0; pointer-events:none; transition:opacity .22s ease,transform .28s cubic-bezier(.2,.9,.2,1); }
    .aiym-share-toast.is-show { opacity:1; transform:translate(-50%,0) scale(1); }
    .aiym-share-toast svg { width:17px; height:17px; color:#5DDB82; flex:0 0 auto; }
    /* 移动端压成一行紧凑操作：44px 触控下限，图标承担识别，文字只保留动作。 */
    @media (max-width:767px) { .aiym-share-popover { position:fixed; inset:auto 12px calc(76px + env(safe-area-inset-bottom,0px)); width:auto; border-radius:20px; } .aiym-share-popover::before { content:""; display:block; width:32px; height:4px; margin:8px auto 0; border-radius:999px; background:rgba(120,120,128,.28); } .aiym-share-popover__head { padding:10px 12px 6px 14px; } .aiym-share-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; padding:0 10px 9px; } .aiym-share-action { flex-direction:row; align-items:center; gap:5px; min-height:44px; padding:6px 7px; border-radius:11px; font-size:11px; white-space:nowrap; } .aiym-share-action svg { width:16px; height:16px; flex:0 0 auto; } .aiym-share-hint { padding:0 14px 10px; font-size:10px; } .aiym-share-toast { top:auto; bottom:calc(88px + env(safe-area-inset-bottom,0px)); } }
    @media (prefers-reduced-transparency:reduce) { .aiym-share-popover { background:var(--color-bg-secondary); backdrop-filter:none; -webkit-backdrop-filter:none; } }
    @media (prefers-reduced-motion:reduce) { .aiym-share-trigger,.aiym-share-action,.aiym-share-toast { transition:none; } }
    </style>
    <span class="aiym-share-wrap" data-aiym-share-wrap>
        <button class="aiym-share-trigger" type="button" data-aiym-share-trigger aria-haspopup="dialog" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg><span>分享</span>
        </button>
        <section class="aiym-share-popover" data-aiym-share-popover role="dialog" aria-label="分享当前页面" hidden>
            <div class="aiym-share-popover__head"><strong class="aiym-share-popover__title">分享</strong><button class="aiym-share-close" type="button" data-aiym-share-close aria-label="关闭分享面板">×</button></div>
            <div class="aiym-share-grid">
                <button class="aiym-share-action" type="button" data-aiym-share-native><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 16V3"></path><path d="m7 8 5-5 5 5"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg><span>系统</span></button>
                <button class="aiym-share-action" type="button" data-aiym-share-copy><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span>复制</span></button>

            </div>
            <p class="aiym-share-hint">“复制分享文案”可直接粘贴到微信、QQ 或任意聊天窗口。</p>
        </section>
    </span>
    <script>
    (function() {
      if (window.AIYMShareReady) { if (window.AIYMShareInit) window.AIYMShareInit(document); return; } window.AIYMShareReady=true;
      function toast(text){ var old=document.querySelector('.aiym-share-toast'); if(old) old.remove(); var el=document.createElement('div'); el.className='aiym-share-toast'; el.setAttribute('role','status'); el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" aria-hidden="true"><path d="m5 12 4.2 4.2L19 6.5"/></svg><span></span>'; el.querySelector('span').textContent=text; document.body.appendChild(el); requestAnimationFrame(function(){el.classList.add('is-show')}); setTimeout(function(){el.classList.remove('is-show');setTimeout(function(){el.remove()},300)},2200); }
      function copy(text){ function fallback(){var el=document.createElement('textarea');el.value=text;el.style.cssText='position:fixed;left:-9999px;opacity:0';document.body.appendChild(el);el.select();var ok=document.execCommand('copy');el.remove();if(!ok)throw new Error('copy failed');} if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text).catch(function(){fallback()});return Promise.resolve(fallback()); }
      function details(){var heading=document.querySelector('.post-title-page,.page-title,.tb-title,h1');var title=(heading&&heading.textContent||document.title).trim();var url=location.href;var site=(document.querySelector('.header-logo__title')||{}).textContent||document.title;var sub=(document.querySelector('.header-logo__sub')||{}).textContent||'';var text='📢 发现一个值得分享的内容\n\n📌 '+title+'\n🔗 '+url+'\n\n—— 来自「'+site.trim()+'」'+(sub.trim()?'\n'+sub.trim():'');return {title:title,url:url,text:text};}
      /* 仅移动端 Sheet 脱离入场动画的 transform containing block；桌面端必须留在按钮旁的定位上下文。 */
      function close(w){var p=w._aiymSharePopover||w.querySelector('[data-aiym-share-popover]'),b=w.querySelector('[data-aiym-share-trigger]');if(p)p.hidden=true;if(b)b.setAttribute('aria-expanded','false');}
      /* 始终挂到 body 顶层：避免 JSON 等工具卡片的 overflow/transform 遮挡。 */
      function place(p,b){if(p.parentNode!==document.body)document.body.appendChild(p);if(window.matchMedia('(max-width: 767px)').matches){p.style.removeProperty('top');p.style.removeProperty('left');p.style.removeProperty('right');return;}var r=b.getBoundingClientRect(),width=p.offsetWidth||220,left=Math.max(12,Math.min(r.left+(r.width-width)/2,window.innerWidth-width-12));p.style.top=(r.bottom+8)+'px';p.style.left=left+'px';p.style.right='auto';}
      function setup(w){if(w.dataset.aiymShareBound)return;w.dataset.aiymShareBound='1';var b=w.querySelector('[data-aiym-share-trigger]'),p=w.querySelector('[data-aiym-share-popover]');w._aiymSharePopover=p;b.addEventListener('click',function(){var show=p.hidden;document.querySelectorAll('[data-aiym-share-wrap]').forEach(close);if(show)place(p,b);p.hidden=!show;b.setAttribute('aria-expanded',String(show));});w.querySelector('[data-aiym-share-close]').addEventListener('click',function(){close(w)});w.querySelector('[data-aiym-share-copy]').addEventListener('click',function(){copy(details().text).then(function(){toast('分享文案已复制，可粘贴到微信或 QQ');close(w)}).catch(function(){toast('复制失败，请手动复制地址栏链接')})});w.querySelector('[data-aiym-share-native]').addEventListener('click',function(){var d=details();if(navigator.share){navigator.share({title:d.title,text:d.text,url:d.url}).catch(function(){})}else{copy(d.text).then(function(){toast('当前浏览器不支持系统分享，文案已复制');close(w)}).catch(function(){toast('当前浏览器不支持系统分享')})}});}
      function init(root){(root||document).querySelectorAll('[data-aiym-share-wrap]').forEach(setup)}
      function closeOutside(e){document.querySelectorAll('[data-aiym-share-wrap]').forEach(function(w){var p=w._aiymSharePopover;if(!e||(!w.contains(e.target)&&!(p&&p.contains(e.target))))close(w)})}
      init();
      /* 点按或滑动页面其他区域时立即收起，避免悬浮 Sheet 遮住后续内容。 */
      document.addEventListener('pointerdown',closeOutside);
      document.addEventListener('click',closeOutside);
      window.addEventListener('scroll',function(){closeOutside()}, {passive:true});
      document.addEventListener('keydown',function(e){if(e.key==='Escape')closeOutside()});
      window.AIYMShareInit=init;
    })();
    </script>
</th:block>
