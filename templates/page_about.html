<!DOCTYPE html>
<html th:replace="~{layout :: html(head = null, content = ~{::content})}"
      xmlns:th="http://www.thymeleaf.org"
      lang="zh-CN">

<th:block th:fragment="content">
    <style>
    /* 继承 .page-content 的 1200px 流式宽度，和资源中心、工具箱及普通页面保持一致。 */
    .ab { width: 100%; max-width: none; margin: 0 auto; padding: 28px 0 72px; }
    @media (max-width: 767px) { .site-content { padding-bottom: 50px; } .ab { padding: 14px 0 0; } .ab > :last-child { margin-bottom: 0; } .ab-hero { padding: 12px 0 10px; } .ab-hero__logo { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 10px; } .ab-hero__logo img { width: 34px; height: 34px; } .ab-hero__name { font-size: 18px; } .ab-hero__slogan { font-size: 12px; margin-top: 3px; letter-spacing: 1.5px; } .ab-hero__wave { font-size: 15px; margin-top: 6px; } }

    /* Hero */
    .ab-hero { text-align: center; padding: 28px 0 20px; }
    .ab-hero__logo {
        width: 76px; height: 76px; border-radius: 20px; margin: 0 auto 14px;
        display: flex; align-items: center; justify-content: center;
        background: var(--color-bg-secondary); border: 1.5px solid var(--color-border-primary);
        box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden;
        transition: transform .3s ease;
    }
    @media (hover: hover) { .ab-hero__logo:hover { transform: scale(1.06) rotate(-2deg); } }
    .ab-hero__logo img { width: 46px; height: 46px; object-fit: contain; }
    .ab-hero__name { font-size: 22px; font-weight: 700; color: var(--color-text-primary); letter-spacing: .5px; }

    .ab-hero__slogan { font-size: 13px; color: var(--color-text-muted); margin-top: 5px; letter-spacing: 2px; }
    .ab-hero__wave { display: inline-flex; width: 20px; height: 20px; margin-top: 10px; color: var(--color-brand-text); }

    @media (max-width: 767px) {
        .ab-hero { padding: 12px 0 10px; }
        .ab-hero__logo { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 10px; }
        .ab-hero__logo img { width: 34px; height: 34px; }
        .ab-hero__name { font-size: 18px; }
        .ab-hero__slogan { font-size: 12px; margin-top: 3px; letter-spacing: 1.5px; }
        .ab-hero__wave { font-size: 15px; margin-top: 6px; }
    }

    /* Content */
    .ab-content {
        background: var(--color-bg-secondary); border-radius: 16px; padding: 24px 22px;
        margin-bottom: 14px; border: 1px solid var(--color-border-primary);
        box-shadow: 0 2px 12px rgba(0,0,0,0.04); font-size: 15px; line-height: 1.8;
        color: var(--color-text-secondary);
    }

    .ab-content :first-child { margin-top: 0; }
    .ab-content :last-child { margin-bottom: 0; }
    .ab-content h2, .ab-content h3 { color: var(--color-text-primary); font-weight: 700; margin: 20px 0 10px; }

    .ab-content h2 { font-size: 18px; }
    .ab-content h3 { font-size: 16px; }
    .ab-content p { margin: 0 0 12px; }
    .ab-content ul, .ab-content ol { padding-left: 20px; margin: 0 0 12px; }
    .ab-content li { margin-bottom: 4px; }
    .ab-content a { color: var(--color-brand); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .2s; }
    .ab-content a:hover { border-bottom-color: var(--color-brand); }
    .ab-content blockquote {
        border-left: 3px solid var(--color-brand); margin: 0 0 12px; padding: 10px 16px;
        background: var(--color-brand-light); border-radius: 0 10px 10px 0;
        color: var(--color-text-secondary); font-style: italic;
    }
    .ab-content img { max-width: 100%; border-radius: 10px; }

    /* Contact */
    .ab-contact {
        background: var(--color-bg-secondary); border-radius: 16px; padding: 8px;
        margin-bottom: 14px; border: 1px solid var(--color-border-primary);
        box-shadow: none;
    }

    .ab-contact__item {
        width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px;
        border: none; border-radius: 12px; cursor: pointer;
        transition: background-color .18s ease, opacity .15s ease;
        background: transparent; color: inherit; text-align: left; text-decoration: none;
    }
    .ab-contact__item + .ab-contact__item { border-top: 1px solid var(--color-border-secondary); }
    .ab-contact__item:active { background: var(--color-brand-light); opacity: .72; }
    .ab-contact__item:focus-visible { outline: 2px solid var(--color-brand); outline-offset: -2px; }
    @media (hover: hover) { .ab-contact__item:hover { background: var(--color-bg-tertiary); } }
    .ab-contact__icon {
        width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
    }
    .ab-contact__icon span { font-size: 20px; }
    .ab-contact__info { flex: 1; min-width: 0; }
    .ab-contact__label { font-size: 11px; color: var(--color-text-secondary); display: block; text-transform: uppercase; letter-spacing: .5px; }
    .ab-contact__val { font-size: 14px; color: var(--color-text-primary); font-weight: 500; margin-top: 1px; display: block; }
    .ab-contact__btn {
        min-width: 58px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center;
        font-size: 12px; color: #fff; font-weight: 700;
        padding: 4px 14px; background: var(--color-brand); border: 1px solid var(--color-brand); border-radius: 20px;
        flex-shrink: 0; text-decoration: none; box-shadow: none;
    }

    /* QR Modal */
    .ab-qr-mask {
        position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999;
        display: none; align-items: center; justify-content: center;
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .ab-qr-mask.show { display: flex; }
    .ab-qr-box {
        position: relative; background: var(--color-bg-secondary); border-radius: 20px; padding: 28px 24px 22px;
        display: flex; flex-direction: column; align-items: center; width: 260px;
        box-shadow: 0 20px 60px rgba(0,0,0,.2); animation: abPop .3s cubic-bezier(.34,1.56,.64,1);
    }
    .ab-qr-close { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--color-text-secondary); }
    .ab-qr-title { font-size: 16px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 16px; }
    .ab-qr-img { width: 180px; height: 180px; border-radius: 12px; border: 1px solid var(--color-border-primary); }
    .ab-qr-name { font-size: 14px; font-weight: 600; color: var(--color-text-primary); margin-top: 14px; }
    .ab-qr-hint { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }

    @keyframes abUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    @keyframes abPop { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
    @media (prefers-reduced-transparency: reduce) {
        .ab-qr-mask { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(0,0,0,.62); }
    }
    </style>

    <div class="ab page-content">
        <!-- Hero -->
        <div class="ab-hero">
            <div class="ab-hero__logo">
                <img th:if="${site.logo}" th:src="${site.logo}" th:alt="${site.title}" loading="lazy">
                <span th:unless="${site.logo}" style="font-size:26px;font-weight:800;color:var(--color-brand);"
                      th:text="${#strings.substring(site.title, 0, 1)}">A</span>
            </div>
            <div class="ab-hero__name" th:text="${site.title}">AIYM-启梦</div>
            <div class="ab-hero__slogan" th:text="${site.subtitle ?: '创意 · 技术 · 分享'}">创意 · 技术 · 分享</div>
            <span class="ab-hero__wave iconify" data-icon="ri-hand-heart-line" aria-hidden="true"></span>
        </div>

        <!-- 主体内容: 后台 HTML 配置 -->
        <div class="ab-content" th:if="${theme.config.about?.aboutContent != null and theme.config.about.aboutContent != ''}"
             th:utext="${theme.config.about.aboutContent}"></div>

        <!-- 联系方式: 后台 repeater 数组 + 旧格式兼容 -->
        <div class="ab-contact" id="ab-contact"></div>
    </div>

    <!-- QR 弹窗 -->
    <div class="ab-qr-mask" id="ab-qr-mask" role="dialog" aria-modal="true" aria-labelledby="ab-qr-title" aria-hidden="true">
        <div class="ab-qr-box" tabindex="-1">
            <button type="button" class="ab-qr-close" id="ab-qr-close" aria-label="关闭二维码"><span class="iconify" data-icon="ri-close-line" aria-hidden="true"></span></button>
            <div class="ab-qr-title" id="ab-qr-title">扫一扫关注</div>
            <img class="ab-qr-img" id="ab-qr-img" src="" alt="二维码">
            <div class="ab-qr-name" id="ab-qr-name"></div>
            <div class="ab-qr-hint">微信搜索关注</div>
        </div>
    </div>

    <script th:inline="javascript">
    /*<![CDATA[*/
    (function() {
        var raw = /*[[${theme.config.about}]]*/ null;
        if (!raw) return;
        var cfg = raw.realNode || raw;
        var globalQr = cfg.aboutQrUrl || cfg.aboutWechatQrUrl || '';
        var mask = document.getElementById('ab-qr-mask');

        /* 新格式: aboutLinks (repeater array) */
        var links = cfg.aboutLinks;

        /* 旧格式兼容 */
        if (!links || !links.length) {
            links = [];
            if (cfg.aboutContactWechat) links.push({ icon: 'ri-wechat-line', label: '公众号', value: cfg.aboutContactWechat, action: 'copy', qr: globalQr });
            if (cfg.aboutContactWeb) links.push({ icon: 'ri-global-line', label: '网站', value: cfg.aboutContactWeb.replace(/^https?:\/\//, ''), action: 'link', qr: '' });
            if (cfg.aboutContactEmail) links.push({ icon: 'ri-mail-line', label: '邮箱', value: cfg.aboutContactEmail, action: 'mail', qr: '' });
        }
        if (!links.length) return;
        var actionText = { copy: '复制', link: '访问', mail: '发送' };

        var el = document.getElementById('ab-contact');
        var h = '';
        links.forEach(function(lnk) {
            var act = lnk.action || 'copy';
            var href = '';
            if (act === 'link') href = (lnk.value || '').indexOf('http') === 0 ? lnk.value : 'https://' + lnk.value;
            var qrUrl = lnk.qr || '';
            var showQr = (act === 'copy' && qrUrl);
            var btnText = showQr ? '查看' : actionText[act];
            var qrAttr = showQr ? ' data-qr="' + esc(qrUrl) + '"' : '';

            var tag = act === 'copy' ? 'button' : 'a';
            var targetAttr = act === 'link' ? ' href="' + esc(href) + '" target="_blank" rel="noopener"' : (act === 'mail' ? ' href="mailto:' + esc(lnk.value || '') + '"' : ' type="button"');
            h += '<' + tag + ' class="ab-contact__item" data-action="' + act + '" data-val="' + esc(lnk.value || '') + '"' + qrAttr + targetAttr + '>';
            h += '<div class="ab-contact__icon">';
            h += '<span class="iconify" data-icon="' + esc(lnk.icon || '') + '"></span>';
            h += '</div>';
            h += '<div class="ab-contact__info">';
            h += '<span class="ab-contact__label">' + esc(lnk.label || '') + '</span>';
            h += '<span class="ab-contact__val">' + esc(lnk.value || '') + '</span>';
            h += '</div>';
            h += '<span class="ab-contact__btn" aria-hidden="true">' + btnText + '</span>';
            h += '</' + tag + '>';
        });
        el.innerHTML = h;

        var closeBtn = document.getElementById('ab-qr-close');
        var lastFocus = null;
        function openQr(qr, val) {
            lastFocus = document.activeElement;
            document.getElementById('ab-qr-img').src = qr;
            document.getElementById('ab-qr-name').textContent = val;
            mask.classList.add('show');
            mask.setAttribute('aria-hidden', 'false');
            closeBtn.focus();
        }
        function closeQr() {
            mask.classList.remove('show');
            mask.setAttribute('aria-hidden', 'true');
            if (lastFocus && lastFocus.focus) lastFocus.focus();
        }

        /* 复制类操作使用原生 button；链接和邮件由原生 a 处理。 */
        el.addEventListener('click', function(e) {
            var item = e.target.closest('.ab-contact__item');
            if (!item) return;
            var action = item.getAttribute('data-action');
            var val = item.getAttribute('data-val');
            if (action !== 'copy') return;
            /* copy */
            var qr = item.getAttribute('data-qr');
            if (qr) {
                openQr(qr, val);
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(val).catch(function(){});
            } else {
                try { var ta=document.createElement('textarea'); ta.value=val; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); } catch(e){}
            }
        });
        closeBtn.addEventListener('click', closeQr);
        mask.addEventListener('click', function(e) { if (e.target === this) closeQr(); });
        document.addEventListener('keydown', function(e) {
            if (!mask.classList.contains('show')) return;
            if (e.key === 'Escape') { closeQr(); return; }
            if (e.key === 'Tab') {
                e.preventDefault();
                closeBtn.focus();
            }
        });

        function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    })();
    /*]]>*/
    </script>
</th:block>

</html>
