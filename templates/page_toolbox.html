<!DOCTYPE html>
<html th:replace="~{layout :: html(head = null, content = ~{::content})}"
      xmlns:th="http://www.thymeleaf.org"
      lang="zh-CN">

<th:block th:fragment="content">
    <style>
    /* ===== 工具箱 Toolbox · Apple-inspired ===== */
    .tb { max-width: 1100px; margin: 0 auto; padding: 28px 0 72px; }

    .hero-icon { display: inline-flex; align-items: center; justify-content: center; width: 1.4em; height: 1.4em;
        margin-right: .12em; vertical-align: middle; line-height: 1; font-size: 1.02em; flex-shrink: 0;
        filter: drop-shadow(0 1px 1px rgba(0,0,0,.05)); text-align: center; }
    /* Header — 排版主导，克制留白 */
    .tb-head { text-align: center; padding: 28px 0 26px; }
    .tb-title {
        font-size: var(--fs-page-title); font-weight: 700; letter-spacing: -0.02em;
        color: var(--color-text-primary); margin: 0 0 8px;
    }
    [data-theme="dark"] .tb-title { color: #f0ece6; }
    .tb-desc {
        font-size: var(--fs-card-desc); color: var(--color-text-muted); margin: 0;
        letter-spacing: 0.5px; font-weight: 400;
    }

    /* Toolbar: search + cats */
    .tb-toolbar { margin-bottom: 22px;
        position: sticky; top: 47px; z-index: 20; background: var(--color-bg-primary); }
    .tb-search { position: relative; margin-bottom: 14px; max-width: 440px; margin-left: auto; margin-right: auto; }
    .tb-search input {
        width: 100%; padding: 13px 44px 13px 18px; font-size: 15px;
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border-primary);
        border-radius: 999px; color: var(--color-text-primary);
        outline: none; transition: border-color .25s, box-shadow .25s, background .25s;
        box-sizing: border-box; font-family: inherit;
        box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }
    .tb-search input::placeholder { color: var(--color-text-muted); }
    .tb-search input:focus {
        border-color: var(--color-brand); background: var(--color-bg-secondary);
        box-shadow: 0 0 0 4px var(--color-brand-glow);
    }
    .tb-search__icon {
        position: absolute; right: 17px; top: 50%; transform: translateY(-50%);
        color: var(--color-text-muted); pointer-events: none; font-size: 16px;
    }

    .tb-cats { display: flex; flex-wrap: nowrap; gap: 22px; justify-content: flex-start; overflow-x: auto;
        scrollbar-width: none; padding: 0 2px; margin-bottom: 14px;
        scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
    .tb-cats::-webkit-scrollbar { display: none; }
    .tb-cat {
        flex: 0 0 auto; position: relative; padding: 10px 2px; font-size: var(--fs-filter); font-weight: 500; letter-spacing: 0.01em;
        background: transparent; color: var(--color-text-secondary); border: none;
        cursor: pointer; transition: color .25s cubic-bezier(.22,1,.36,1); font-family: inherit; white-space: nowrap;
        -webkit-tap-highlight-color: transparent; scroll-snap-align: start;
    }
    .tb-cat::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px;
        border-radius: 2px; background: var(--color-brand); transform: scaleX(0); transform-origin: center;
        transition: transform .28s cubic-bezier(.22,1,.36,1); }
    .tb-cat:hover { color: var(--color-text-primary); }
    .tb-cat.active { color: var(--color-brand); font-weight: 600; }
    .tb-cat.active::after { transform: scaleX(1); }

    /* Grid */
    .tb-grid {
        display: grid; gap: 14px;
        grid-template-columns: repeat(2, 1fr);
        max-width: 600px; margin: 0 auto;
    }
    @media (min-width: 768px) { .tb-grid { grid-template-columns: repeat(3, 1fr); max-width: 780px; gap: 16px; } }
    @media (min-width: 1024px) { .tb-grid { grid-template-columns: repeat(4, 1fr); max-width: 960px; } }
    @media (min-width: 1280px) { .tb-grid { grid-template-columns: repeat(5, 1fr); max-width: 1100px; } }

    /* Card — 轻量玻璃质感，连续圆角，无硬描边 */
    .tb-card {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 15px;
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border-primary);
        border-radius: 18px;
        cursor: pointer; text-decoration: none; color: inherit;
        transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease, border-color .3s ease, background .3s ease;
        overflow: hidden; min-width: 0;
    }
    @media (hover: hover) {
    .tb-card:hover {
        transform: translateY(-3px);
        border-color: var(--color-border-secondary);
        background: color-mix(in srgb, var(--color-bg-secondary) 82%, var(--color-brand-rgb, 66 165 245) 6%);
        box-shadow: 0 12px 32px rgba(0,0,0,.08);
    }
    [data-theme="dark"] .tb-card:hover {
        background: rgba(40,40,40,.82); border-color: var(--color-brand);
        box-shadow: 0 14px 36px rgba(0,0,0,.35);
    }
}
    .tb-card:active { transform: scale(.975); transition-duration: .1s; }
    @media (hover: none) { .tb-card:active { transform: none; } }
    [data-theme="dark"] .tb-card { background: rgba(30,30,30,.72); border-color: rgba(255,255,255,.08); }

    .tb-icon {
        width: 42px; height: 42px; border-radius: 23%; /* 连续圆角接近 squircle */
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    }
    .tb-card:hover .tb-icon { transform: scale(1.06); }

    .tb-info { flex: 1; min-width: 0; overflow: hidden; }
    .tb-name {
        font-size: var(--fs-card-title); font-weight: 600; letter-spacing: -0.01em; color: var(--color-text-primary);
        display: flex; align-items: center; gap: 6px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    [data-theme="dark"] .tb-name { color: #f0ece6; }
    .tb-desc {
        font-size: 12px; color: var(--color-text-muted);
        margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Badge — 柔和胶囊 */
    .tb-badge {
        font-size: 10px; font-weight: 600; padding: 2px 8px;
        background: var(--color-brand-light); color: var(--color-brand);
        border-radius: 999px; flex-shrink: 0; line-height: 1.4;
    }

    /* Count */
    .tb-count {
        font-size: 12px; color: var(--color-text-muted); margin-top: 20px; text-align: center;
        animation: tbUp .5s ease-out .2s both;
    }

    /* Empty */
    .tb-empty { text-align: center; padding: 56px 0; animation: tbUp .5s ease-out both; }
    .tb-empty__icon { font-size: 44px; margin-bottom: 12px; opacity: .5; }
    .tb-empty__text { font-size: 14px; color: var(--color-text-muted); }

    @keyframes tbUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

    /* 无障碍：尊重减少动效偏好 */
    @media (prefers-reduced-motion: reduce) {
        .tb-head, .tb-toolbar, .tb-card, .tb-count, .tb-empty { animation: none !important; }
        .tb-card, .tb-card:hover, .tb-card:active, .tb-icon { transition: none !important; transform: none !important; }
    }

    @media (max-width: 767px) {
        .tb { padding: 12px 0 80px; }
        .tb-head { padding: 8px 0 6px; }
        .tb-title { font-size: 20px; }
        .tb-desc { font-size: var(--fs-card-desc); }
        .tb-toolbar { margin-bottom: 8px; top: 47px; }
        .tb-search { margin-bottom: 10px; max-width: 100%; }
        .tb-search input { padding: 11px 40px 11px 16px; font-size: 13px; }
        .tb-cats { gap: 22px; overflow-x: auto; flex-wrap: nowrap; justify-content: flex-start; padding: 0 2px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .tb-cats::-webkit-scrollbar { display: none; }
        .tb-cat { padding: 9px 2px; font-size: var(--fs-filter); flex-shrink: 0; }
        .tb-grid { gap: 10px; padding: 0; max-width: 100%; }
        .tb-card { padding: 12px; gap: 10px; border-radius: 16px; }
        .tb-card:hover { transform: none; border-color: var(--color-border-secondary); background: var(--color-bg-secondary); }
        .tb-card:active { transform: scale(.97); }
        .tb-icon { width: 40px; height: 40px; }
        .tb-icon span { font-size: 19px !important; }
        .tb-name { font-size: 14px; }
        .tb-desc { font-size: 12px; margin-top: 2px; }
        .tb-badge { font-size: 9px; padding: 1px 6px; }
        .tb-count { font-size: 11px; margin-top: 12px; }
    }
    </style>

    <div class="tb page-content">
        <div class="tb-head">
            <h1 class="tb-title"><span class="hero-icon">🧰</span>工具箱</h1>
            <p class="tb-desc">开发利器，随用随走</p>
        </div>

        <div class="tb-toolbar">
            <div class="tb-search">
                <input type="text" id="tb-search" placeholder="搜索工具..." autocomplete="off">
                <span class="tb-search__icon iconify" data-icon="ri-search-line"></span>
            </div>
            <div class="tb-cats" id="tb-cats"></div>
        </div>

        <div class="tb-grid" id="tb-grid"></div>
        <div class="tb-count" id="tb-count"></div>
        <div class="tb-empty" id="tb-empty" style="display:none">
            <div class="tb-empty__icon">🔍</div>
            <div class="tb-empty__text">没有找到匹配的工具</div>
        </div>
    </div>

    <script th:inline="javascript">
    /*<![CDATA[*/
    (function() {
        var brandColor = '#42A5F5';
        var root = document.documentElement;
        root.style.setProperty('--tb-brand', brandColor);

        var catsEl = document.getElementById('tb-cats');
        var gridEl = document.getElementById('tb-grid');
        var countEl = document.getElementById('tb-count');
        var emptyEl = document.getElementById('tb-empty');
        var currentCat = 'all';
        var searchVal = '';
        var allItems = [];

        /* 从 API 拉取所有 tools/ 路径的页面 */
        fetch('/apis/api.content.halo.run/v1alpha1/singlepages?size=50')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var pages = data.items || [];
                pages.forEach(function(page) {
                    var slug = (page.spec || {}).slug || '';
                    if (slug.indexOf('tools/') !== 0 || slug === 'tools') return;
                    var ann = (page.metadata || {}).annotations || {};
                    allItems.push({
                        name: (page.spec || {}).title || slug.split('/').pop(),
                        desc: (page.spec || {}).excerpt && (page.spec.excerpt || {}).raw || '',
                        icon: ann['tools.icon'] || 'mdi:puzzle',
                        color: ann['tools.color'] || brandColor,
                        bg: ann['tools.bg'] || (brandColor + '18'),
                        cat: ann['tools.cat'] || '其他',
                        path: '/' + slug,
                        sort: parseInt(ann['tools.sort'] || '99')
                    });
                });
                /* 合并外部工具（来自主题设置） */
                var raw = /*[[${theme.config.toolbox}]]*/ null;
                if (raw) {
                    var cfg = raw.realNode || raw;
                    var extItems = cfg.toolboxItems || [];
                    extItems.forEach(function(item) {
                        if ((item.path || '').indexOf('http') !== 0) return;
                        allItems.push({
                            name: item.name || '',
                            desc: item.desc || '',
                            icon: item.icon || 'mdi:link',
                            color: item.color || brandColor,
                            bg: item.bg || (brandColor + '18'),
                            cat: item.cat || '外部',
                            path: item.path,
                            badge: item.badge || '',
                            sort: 999
                        });
                    });
                }
                /* 按 sort 排序 */
                allItems.sort(function(a, b) { return a.sort - b.sort; });
                renderCats();
                renderGrid();
            })
            .catch(function() {
                gridEl.innerHTML = '<div class="tb-empty"><div class="tb-empty__icon">⚠️</div><div class="tb-empty__text">加载失败</div></div>';
            });

        function renderCats() {
            var catSet = new Set();
            allItems.forEach(function(item) { if (item.cat) catSet.add(item.cat); });
            var allCats = Array.from(catSet);
            var h = '<button class="tb-cat active" data-cat="all">全部</button>';
            allCats.forEach(function(cat) {
                h += '<button class="tb-cat" data-cat="' + esc(cat) + '">' + esc(cat) + '</button>';
            });
            catsEl.innerHTML = h;
            catsEl.querySelectorAll('.tb-cat').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    currentCat = this.getAttribute('data-cat');
                    catsEl.querySelectorAll('.tb-cat').forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    renderGrid();
                });
            });
        }

        function renderGrid() {
            var kw = searchVal.toLowerCase();
            var filtered = allItems.filter(function(item) {
                if (currentCat !== 'all' && item.cat !== currentCat) return false;
                if (kw) {
                    return (item.name || '').toLowerCase().indexOf(kw) !== -1
                        || (item.desc || '').toLowerCase().indexOf(kw) !== -1;
                }
                return true;
            });

            if (!filtered.length) {
                gridEl.innerHTML = '';
                countEl.textContent = '';
                emptyEl.style.display = '';
                return;
            }
            emptyEl.style.display = 'none';
            countEl.textContent = '共 ' + filtered.length + ' 个工具';

            var h = '';
            filtered.forEach(function(item, i) {
                h += '<a class="tb-card" href="' + esc(item.path) + '"'
                   + ' style="animation-delay:' + (i * 40) + 'ms">';
                h += '<div class="tb-icon" style="background:' + esc(item.bg) + '">';
                h += '<span class="iconify" data-icon="' + esc(item.icon) + '" style="color:' + esc(item.color) + ';font-size:22px"></span>';
                h += '</div>';
                h += '<div class="tb-info">';
                h += '<div class="tb-name">' + esc(item.name) + '</div>';
                h += '<div class="tb-desc">' + esc(item.desc) + '</div>';
                h += '</div></a>';
            });
            gridEl.innerHTML = h;

            if (window.Iconify && window.Iconify.renderDOM) {
                window.Iconify.renderDOM(gridEl);
            }
        }

        document.getElementById('tb-search').addEventListener('input', function() {
            var self = this;
            clearTimeout(self._timer);
            self._timer = setTimeout(function() {
                searchVal = self.value.trim();
                renderGrid();
            }, 150);
        });

        function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    })();
    /*]]>*/
    </script>

        <!-- 返回顶部按钮 -->
        <button class="back-to-top" data-back-to-top aria-label="返回顶部">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
</th:block>

</html>
