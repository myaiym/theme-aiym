<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:fragment="html(head, content)"
      th:attr="data-theme=${theme.config.appearance?.defaultMode == 'dark' ? 'dark' : 'light'},
               data-default-theme=${theme.config.appearance?.defaultMode ?: 'system'},
               data-border-radius=${theme.config.appearance?.borderRadius ?: 'medium'},
               data-enable-animation=${theme.config.appearance?.enableAnimation != false}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title th:text="${post?.spec?.title ?: category?.spec?.displayName ?: tag?.spec?.displayName ?: singlePage?.spec?.title ?: site.title}">AIYM Halo 主题</title>

    <meta name="theme-color"
          th:content="${theme.config.appearance?.brandColor ?: '#42A5F5'}"
          content="#42A5F5">

    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">

    <link rel="alternate" type="application/rss+xml" th:title="${site.title}" th:href="@{/feed.xml}">

    <!-- 关键 CSS：防止页面闪烁 -->
    <style>
    /* ============================
       布局结构（所有页面共享）
       ============================ */

    /* 页头 */
    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; overflow: hidden; isolation: isolate; background: rgba(250,248,245,0.80); border-bottom: 1px solid rgba(255,255,255,0.60); backdrop-filter: blur(28px) saturate(155%); -webkit-backdrop-filter: blur(28px) saturate(155%); box-shadow: 0 8px 28px rgba(26,23,20,0.04), inset 0 1px 0 rgba(255,255,255,.72); }
    .site-header::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(105deg, rgba(255,255,255,.32), transparent 34%, rgba(255,255,255,.10) 68%, rgba(255,255,255,.24)); }
    [data-theme="dark"] .site-header { background: rgba(18,18,18,0.80); border-bottom-color: rgba(255,255,255,.10); box-shadow: 0 8px 28px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.12); }
    [data-theme="dark"] .site-header::before { background: linear-gradient(105deg, rgba(255,255,255,.10), transparent 34%, rgba(255,255,255,.04) 68%, rgba(255,255,255,.08)); }
    .header-inner { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; width: 100%; max-width: 1520px; margin: 0 auto; height: 56px; padding: 0 clamp(20px, 4vw, 64px); box-sizing: border-box; }

    /* 导航栏 */
    .header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .header-logo__icon { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .header-logo__icon img { width: 36px; height: 36px; border-radius: 10px; object-fit: contain; }
    .header-logo__icon-text { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; background: var(--color-brand); border-radius: 10px; }
    .header-logo__text { display: flex; flex-direction: column; }
    .header-logo__title { font-size: 15px; font-weight: 700; color: var(--color-text-primary); line-height: 1.2; }
    .header-logo__sub { font-size: 9px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 2px; text-transform: uppercase; }
    .header-tabbar { grid-column: 2; min-width: 0; }
    .tabbar-track { display: flex; align-items: center; padding: 3px; border-radius: 16px; border: 1px solid rgba(255,255,255,.48); background: rgba(255,255,255,.28); box-shadow: inset 0 1px 0 rgba(255,255,255,.56), 0 1px 2px rgba(26,23,20,.04); }
    /* 桌面端菜单轨道适度加宽，避免居中菜单两侧视觉留白过大；中小桌面由下方断点收缩。 */
    .tabbar-item { display: flex; align-items: center; gap: 5px; padding: 7px clamp(18px, 2.4vw, 36px); border-radius: 12px; font-size: 13px; font-weight: 500; color: var(--color-text-secondary); text-decoration: none; transition: color .2s ease, background-color .2s ease, box-shadow .2s ease; white-space: nowrap; }
    @media (hover: hover) and (pointer: fine) {
        .tabbar-item:hover { color: var(--color-text-primary); background: rgba(255,255,255,.34); }
        .tabbar-item:hover .iconify { transform: scale(1.15); }
        [data-theme="dark"] .tabbar-item:hover { color: var(--color-text-primary); background: rgba(255,255,255,.10); }
        .header-action-btn:hover { color: var(--color-brand); background: var(--color-bg-tertiary); }
        .header-user__trigger:hover { background: rgba(0,0,0,0.06); }
        .header-user__menu-item:hover { background: var(--color-bg-tertiary); color: var(--color-text-primary); }
        .header-user__menu-item--danger:hover { background: rgba(244,67,54,0.08); color: var(--color-error); }
        .mobile-header__action:hover { background: rgba(0,0,0,0.05); }
        [data-theme="dark"] .mobile-header__action:hover { background: rgba(255,255,255,0.08); }
    }
    .tabbar-item.active { color: var(--color-brand-text); background: rgba(255,255,255,.62); box-shadow: inset 0 1px 0 rgba(255,255,255,.82), 0 1px 3px rgba(26,23,20,.07); }
    .tabbar-item .iconify { transition: transform 0.3s; display: inline-flex; align-items: center; overflow: visible; flex-shrink: 0; width: 1.15em; height: 1.15em; margin: 0 -0.07em; }
    .tabbar-item .iconify svg { width: 100%; height: 100%; }
    [data-theme="dark"] .tabbar-track { border-color: rgba(255,255,255,.12); background: rgba(255,255,255,.06); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.12); }
    [data-theme="dark"] .tabbar-item { color: var(--color-text-muted); }
    [data-theme="dark"] .tabbar-item.active { color: var(--color-brand-text); background: rgba(255,255,255,.15); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 1px 3px rgba(0,0,0,.14); }

    /* 菜单动画 */
    .animated-hover .iconify { display: inline-block; }
    .animated-hover:hover .iconify,
    .animated-hover:focus .iconify,
    .animated-hover:active .iconify { animation: faa-float 0.6s ease-in-out; }
    @keyframes faa-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

    /* 右侧区域 */
    .header-right { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: clamp(8px, 1.2vw, 16px); min-width: 0; }
    .header-greeting { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
    .header-greeting__text { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); letter-spacing: 0.5px; white-space: nowrap; }
    .header-greeting__stats { font-size: 11px; color: var(--color-text-muted); white-space: nowrap; }
    [data-theme="dark"] .header-greeting { color: var(--color-text-muted); }
    [data-theme="dark"] .header-greeting strong { color: var(--color-text-primary); }

    /* 中小桌面：菜单与两侧操作按可用空间收缩，避免绝对居中时相互遮挡。 */
    @media (min-width: 768px) and (max-width: 1100px) {
        .header-inner { padding-inline: clamp(16px, 2.5vw, 28px); }
        .header-greeting { display: none; }
        .header-logo__sub { display: none; }
        .tabbar-item { gap: 4px; padding-inline: clamp(10px, 1.5vw, 16px); font-size: 12px; }
        .header-right { gap: 8px; }
        .header-user__trigger { padding-right: 8px; }
        .header-user__text { display: none; }
    }
    @media (min-width: 768px) and (max-width: 860px) {
        .header-logo__text { display: none; }
        .tabbar-item { padding-inline: 9px; }
    }
    @media (prefers-reduced-transparency: reduce) {
        .site-header { background: var(--color-bg-primary); backdrop-filter: none; -webkit-backdrop-filter: none; }
        .site-header::before { display: none; }
        .tabbar-track { background: var(--color-bg-tertiary); }
        .tabbar-item.active { background: var(--color-bg-secondary); }
    }

    /* 操作按钮 */
    .header-action-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; color: var(--color-text-secondary); border-radius: 8px; transition: all 0.2s; background: none; border: none; cursor: pointer; }
    .header-action-btn svg { width: 18px; height: 18px; }

    /* 主题切换 */
    .theme-toggle { position: relative; }
    .theme-icon { display: flex; align-items: center; justify-content: center; position: relative; width: 18px; height: 18px; }
    .theme-icon--moon, .theme-icon--sun { position: absolute; transition: all 0.3s ease; }
    [data-theme="light"] .theme-icon--moon { opacity: 1; transform: rotate(0deg) scale(1); }
    [data-theme="light"] .theme-icon--sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }
    [data-theme="dark"] .theme-icon--moon { opacity: 0; transform: rotate(90deg) scale(0.5); }
    [data-theme="dark"] .theme-icon--sun { opacity: 1; transform: rotate(0deg) scale(1); }

    /* 用户头像区域 */
    .header-user { position: relative; }
    .header-user__trigger { display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 8px; border-radius: 24px; cursor: pointer; transition: all 0.2s; background: rgba(0,0,0,0.03); text-decoration: none; color: inherit; }
    .header-user__trigger--guest { text-decoration: none; }
    .header-user__avatar { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--color-brand); }
    .header-user__avatar img { width: 100%; height: 100%; object-fit: cover; }
    .header-user__avatar span, .header-user__avatar svg { color: #fff; }
    .header-user__avatar--guest { background: var(--color-bg-tertiary); }
    .header-user__avatar--guest svg { color: var(--color-text-muted); }
    .header-user__text { display: flex; flex-direction: column; min-width: 0; }
    .header-user__name { font-size: 13px; font-weight: 600; color: var(--color-text-primary); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-user__sub { font-size: 10px; color: var(--color-text-muted); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 用户下拉菜单 */
    .header-user__menu { position: absolute; right: 0; top: calc(100% + 8px); width: 200px; background: var(--color-bg-secondary); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); border: 1px solid var(--color-border-primary); z-index: 300; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.2s ease; }
    .header-user:hover .header-user__menu { opacity: 1; visibility: visible; transform: translateY(0); }
    .header-user__menu-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
    .header-user__menu-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--color-brand); display: flex; align-items: center; justify-content: center; }
    .header-user__menu-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .header-user__menu-avatar svg { color: #fff; }
    .header-user__menu-info { display: flex; flex-direction: column; min-width: 0; }
    .header-user__menu-name { font-size: 13px; font-weight: 600; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-user__menu-sub { font-size: 11px; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-user__menu-divider { height: 1px; background: var(--color-border-primary); margin: 0 12px; }
    .header-user__menu-options { padding: 6px 8px; }
    .header-user__menu-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--color-text-secondary); text-decoration: none; transition: all 0.15s; }
    .header-user__menu-item--danger { color: var(--color-error); }

    /* 移动端头部 */
    .mobile-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; background: rgba(250,248,245,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    /* 某些 Halo/Thymeleaf 缓存版本会重复输出移动头部；只保留第一个，避免两个 fixed header 叠加。 */
    body > .mobile-header ~ .mobile-header { display: none !important; }
    [data-theme="dark"] .mobile-header { background: rgba(18,18,18,0.92); }
    .mobile-header__left { display: flex; align-items: center; }
    .mobile-header__logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .mobile-header__logo-icon { width: 28px; height: 28px; border-radius: 7px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .mobile-header__logo-icon img { width: 100%; height: 100%; border-radius: 7px; object-fit: cover; }
    .mobile-header__icon-text { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; background: var(--color-brand); border-radius: 7px; }
    .mobile-header__logo-text { display: flex; flex-direction: column; line-height: 1.2; }
    .mobile-header__title { font-size: 14px; font-weight: 700; color: var(--color-text-primary); }
    .mobile-header__sub { font-size: 9px; font-weight: 500; color: var(--color-text-muted); letter-spacing: 0.5px; margin-top: 1px; }
    .mobile-header__right { display: flex; align-items: center; gap: 8px; }
    .mobile-header__action { color: var(--color-text-secondary); padding: 6px; display: flex; text-decoration: none; border-radius: 8px; transition: all 0.2s; background: none; border: none; cursor: pointer; align-items: center; justify-content: center; }
    .mobile-header .theme-icon--moon { display: block; }
    .mobile-header .theme-icon--sun { display: none; }
    [data-theme="dark"] .mobile-header__title { color: var(--color-text-primary); }
    [data-theme="dark"] .mobile-header__action { color: var(--color-text-muted); }
    [data-theme="dark"] .mobile-header .theme-icon--moon { display: none; }
    [data-theme="dark"] .mobile-header .theme-icon--sun { display: block; }

    /* 页脚基础（共享布局） */
    footer.site-footer.aiym-footer, .site-footer.aiym-footer { width: 100%; box-sizing: border-box; flex-shrink: 0; margin-top: auto; padding: 14px 16px 6px; text-align: center; background: transparent; border-top: none; border: none; }
    .aiym-footer__line { width: 40px; height: 2px; border-radius: 1px; margin: 0 auto 14px; opacity: 0.3; background: linear-gradient(90deg, var(--color-brand), var(--color-brand-hover)); }
    .aiym-footer__content { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .aiym-footer__brand-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 2px; }
    .aiym-footer__logo { width: 16px !important; height: 16px !important; border-radius: 50% !important; overflow: hidden; background: var(--color-brand); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .aiym-footer__logo img { width: 100% !important; height: 100% !important; max-width: none !important; border-radius: 0 !important; object-fit: contain; }
    .aiym-footer__logo span { font-size: 12px; font-weight: 700; color: #fff; }
    .aiym-footer__brand { font-size: 12px; color: var(--color-text-muted); font-weight: 600; }
    .aiym-footer__slogan { font-size: 11px; color: var(--color-text-muted); letter-spacing: 2px; margin: 0; }
    .aiym-footer__copy { font-size: 11px; color: var(--color-text-muted); margin: 0; }
    .aiym-footer__icp { font-size: 11px; color: var(--color-text-muted); margin: 0; }
    /* 备案号 <a> 无 class，会被全局 a:not([class]) 套上蓝色下划线；此处必须用 !important 强压成与其他页脚文字一致 */
    .aiym-footer__icp a { color: inherit !important; text-decoration: none !important; }
    .aiym-footer__icp a:link, .aiym-footer__icp a:visited, .aiym-footer__icp a:hover, .aiym-footer__icp a:active { color: inherit !important; text-decoration: none !important; }
    .aiym-footer__icp a:focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; border-radius: 2px; }
    .aiym-footer__police { margin: 0; }
    @media (max-width: 767px) {
        footer.site-footer.aiym-footer, .site-footer.aiym-footer {
            position: static !important;
            left: auto !important; right: auto !important; bottom: auto !important;
            background: transparent !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            padding-bottom: 16px !important;
            margin-bottom: calc(88px + env(safe-area-inset-bottom, 0px)) !important;
        }
    }
    @media (min-width: 768px) {
        /* 短页面由内容区补足视口高度，长页面仍按正文自然撑开：页脚只在短页贴底。 */
        html, body { min-height: 100%; }
        body { min-height: 100vh; display: flex; flex-direction: column; }
        /* 允许短页内容区吸收剩余空间，同时在页脚高度较大时收缩，避免多出一段可滚动空白。 */
        .site-content { flex: 1 1 auto; min-height: 0; }
        /* 桌面端也按移动端的纵向信息层级展示，页脚随正文自然出现。 */
        footer.site-footer.aiym-footer, .site-footer.aiym-footer { position: static; margin-top: 0; padding: 18px 24px 12px !important; }
        .aiym-footer__line { display: block; }
        .aiym-footer__content { flex-direction: column; align-items: center; gap: 2px; }
        .aiym-footer__brand-row { margin-bottom: 2px; }
    }

    @media (max-width: 767px) {
        /* 移动端固定头部必须完全遮住下面滚动内容；透明背景会让返回 PJAX 后的卡片颜色透出来。 */
        .mobile-header { height: 50px; background: var(--color-bg-primary) !important; opacity: 1; }
        [data-theme="dark"] .mobile-header { background: var(--color-bg-primary) !important; }
        /* 头部实际高度为 50px，内容起始位也必须严格对齐，不能留下 2~6px 的透视缝隙。 */
        .site-content { padding-top: 50px !important; }
        .category-filter { top: 50px !important; background: var(--color-bg-primary) !important; opacity: 1; }
    }

    /* 内容区 */
    .site-content { padding-top: 56px; }
    /* ⚠️ 白色背景只在 post.html 的 .post-main 加，不要加在全局 .container 上 */
    /* 全局流式内容容器：最大内容宽 1200px，中小桌面不再跳回 720px 固定档。 */
    .site-content > .container { width: 100%; max-width: 1280px; margin: 0 auto; padding-inline: clamp(20px, 3vw, 40px); box-sizing: border-box; }
    .page-content { max-width: 1200px; margin: 0 auto; padding: 0 12px; box-sizing: border-box; }
    @media (min-width: 768px) { .page-content { padding: 0; } }
    @media (max-width: 767px) { .page-content { padding: 0; } }
    /* 三个聚合页（首页/资源/工具箱）直接使用外层流式容器；移动端仍由各页自身规则控制。 */
    .home { width: 100%; max-width: none; margin: 0; padding: 0; box-sizing: border-box; }
    /* 分类筛选基础样式（防 FOUC，详细样式在 index.html） */
    .category-filter { overflow-x: auto; scrollbar-width: none; position: sticky; top: 56px; z-index: 90; padding: 0 !important; margin: 0; background: var(--color-bg-primary); text-align: left; }
    .category-scroll { display: flex; gap: 8px; padding: 0; white-space: nowrap; justify-content: flex-start; text-align: left; }
    .category-pill { display: inline-flex; align-items: center; gap: 4px; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; color: var(--color-text-secondary); background: var(--color-bg-secondary); border: 1px solid var(--color-border-primary); cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
    .category-pill--active { background: linear-gradient(135deg, var(--color-brand), var(--color-brand-hover)); color: var(--color-text-inverse); border-color: transparent; font-weight: 600; }

    /* 首次进入的轻量 materialize：只动 opacity/transform，不碰布局或滚动位置。
       返回列表由 PJAX/bfcache 直接恢复，明确不套此效果，避免用户感到列表重新加载。 */
    @keyframes aiym-materialize-in {
        from { opacity: 0; transform: translateY(10px) scale(.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .aiym-enter-item {
        animation: aiym-materialize-in 420ms cubic-bezier(.22, 1, .36, 1) both;
        animation-delay: var(--aiym-enter-delay, 0ms);
        will-change: transform, opacity;
    }
    @media (prefers-reduced-motion: reduce) {
        @keyframes aiym-materialize-in { from { opacity: 0; } to { opacity: 1; } }
        .aiym-enter-item { animation-duration: 180ms; }
    }

    /* 返回顶部按钮（全局共享） */
    .back-to-top {
        position: fixed; bottom: 80px; right: 16px; z-index: 200;
        width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
        background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
        box-shadow: 0 2px 12px rgba(0,0,0,0.1); color: var(--color-text-secondary);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; visibility: hidden; transform: translateY(10px);
        transition: all 0.3s ease;
    }
    .back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
    [data-theme="dark"] .back-to-top { background: rgba(30,30,30,0.9); color: var(--color-text-muted); }
    @media (hover: hover) and (pointer: fine) {
        .back-to-top:hover { background: var(--color-brand); color: #fff; box-shadow: 0 4px 16px rgba(var(--color-brand-rgb),0.3); }
        [data-theme="dark"] .back-to-top:hover { background: var(--color-brand); color: #fff; }
    }
    @media (max-width: 767px) {
        .back-to-top { bottom: 90px; right: 12px; width: 36px; height: 36px; }
    }

    </style>

        <script>
        (function () {
          /* 返回不刷新、保持原样：
             优先原生 bfcache(命中则不干预，页面原样原位)。
             若 bfcache 未命中(如首页图未加载完等)，页面会被重载 ->
             用 sessionStorage 记住离开时的滚动位置，返回时轻量恢复，
             让"进详情前在哪，返回后还在哪"。只滚动一次，不做轮询防卡。 */
          function key() { var p = location.pathname || "/"; return "__aiym_scroll_" + p.replace(/[^a-z0-9\/_-]/gi, "_"); }
          window.addEventListener("pagehide", function() {
            try { sessionStorage.setItem(key(), String(window.scrollY || document.documentElement.scrollTop || 0)); } catch(e){}
          });
          function scrollTop() {
            var r = document.documentElement;
            r.style.scrollBehavior = "auto";
            window.scrollTo(0, 0);
            r.style.removeProperty("scroll-behavior");
          }
          window.addEventListener("pageshow", function(ev){
            if (ev.persisted) {   /* bfcache 命中：页面原样原位 */
              /* 返回瞬间可能残留某张卡片的 :active 缩放(手指未松开时被夹)。强刷层复位一次。 */
              var root = document.documentElement;
              try {
                root.classList.add("bfr");
                setTimeout(function(){ root.classList.remove("bfr"); }, 260);
              } catch(e){}
              return;
            }
            var navEntry = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
            var type = navEntry && navEntry.type || "navigate";
            if (type === "reload") { scrollTop(); return; }   /* 手动刷新 -> 回顶 */
            if (type === "back_forward") {
              /* 返回且未进 bfcache:页面被重载,卡片异步渲染。
                 等高度足够后滚动到离开位置(否则 scrollTo 无效会回顶)。
                 ⚠️ 若用户立刻开始手动滑动,必须立即中止恢复,不能反复 scrollTo 拖回
                 (否则用户上下滑动会被拖回原位、感觉"无法正常滑/闪")。 */
              try {
                var y = parseFloat(sessionStorage.getItem(key()) || "0");
                if (isNaN(y) || y <= 0) { return; }
                var r = document.documentElement;
                var cancelled = false;
                function stop(){ cancelled = true; window.removeEventListener("wheel", stop); window.removeEventListener("touchstart", stop); window.removeEventListener("pointerdown", stop); }
                window.addEventListener("wheel", stop);
                window.addEventListener("touchstart", stop);
                window.addEventListener("pointerdown", stop);
                var tries = 0;
                (function attempt() {
                  if (cancelled) { return; }
                  r.style.scrollBehavior = "auto";
                  window.scrollTo(0, y);
                  r.style.removeProperty("scroll-behavior");
                  tries++;
                  var cur = window.scrollY || document.documentElement.scrollTop;
                  if (cur >= y - 2) { stop(); return; }              /* 已到 */
                  var canHold = (document.documentElement.scrollHeight - innerHeight) >= (y - 40);
                  if (!canHold && tries < 12) {                     /* 高度未够,等卡片渲染后再试 */
                    setTimeout(attempt, 150);
                  } else {
                    stop();                                          /* 高度够了仍滚不到就放弃,交还用户 */
                  }
                })();
              } catch(e){}
            }
          });
        })();
        /* ===== 页面首次 materialize（聚合/详情内容） =====
           只用于全新进入或前进到详情：回退列表与 bfcache 恢复均不播放，绝不干扰现有滚动恢复链路。 */
        (function(){
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var selector = [
            /* 首页/资源的内容区均由骨架异步替换真实卡片；只动筛选控件，避免真实列表在替换后再闪现。 */
            '.home > .category-filter',
            '.resources-page > .res-hero', '.resources-page > .res-filter',
            '.post-layout > .post-main', '.post-layout > .post-toc-sidebar',
            '.tool-detail-page > *'
          ].join(',');
          function materialize(root){
            if (reduce || !root || root.dataset.aiymMaterialized === '1') return;
            var items = Array.prototype.slice.call(root.querySelectorAll(selector));
            if (!items.length) return;
            root.dataset.aiymMaterialized = '1';
            items.forEach(function(el, i){
              el.style.setProperty('--aiym-enter-delay', Math.min(i * 36, 144) + 'ms');
              el.classList.add('aiym-enter-item');
              el.addEventListener('animationend', function(){
                el.classList.remove('aiym-enter-item');
                el.style.removeProperty('--aiym-enter-delay');
              }, {once:true});
            });

          window.AIYMPageEnter = materialize;
          window.addEventListener('pageshow', function(ev){
            if (ev.persisted) return; /* bfcache：保持用户离开时的原样 */
            var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
            if (nav && nav.type === 'back_forward') return; /* 硬返回也只恢复滚动，不重演 */
            requestAnimationFrame(function(){ materialize(document.querySelector('main#main-content')); });
          });
        })();

        /* ===== 轻量 PJAX：列表卡片与详情页共用 =====
           只接管明确标记 data-pjax 的同源卡片；普通导航、外链、表单不受影响。
           详情页仍由服务端完整渲染，PJAX 只替换 main，返回列表不再整页刷新。 */
        (function(){
          var currentRequest = null;
          /* 已访问列表保留其真实 DOM（含动态卡片与事件绑定）。
             返回时直接换回，而非重新请求后先显示骨架再校正滚动，避免深处卡片返回时闪一下。 */
          var pageCache = Object.create(null);
          function currentPjaxStyles(){
            return Array.prototype.map.call(document.querySelectorAll('style[data-aiym-pjax-style]'), function(s){ return s.textContent || ''; });
          }
          function restorePjaxStyles(styles){
            document.querySelectorAll('style[data-aiym-pjax-style]').forEach(function(s){ s.remove(); });
            (styles || []).forEach(function(text){
              var style = document.createElement('style');
              style.setAttribute('data-aiym-pjax-style','');
              style.textContent = text;
              document.head.appendChild(style);
            });
          }
          function cacheCurrentPage(url, main){
            if (!url || !main) return;
            pageCache[url] = { main: main, title: document.title, styles: currentPjaxStyles() };
          }
          function restoreCachedPage(url, scrollY, horizontal){
            var cached = pageCache[url];
            var current = document.querySelector('main#main-content');
            if (!cached || !cached.main || !current || !current.parentNode) return false;
            if (currentRequest) { currentRequest.abort(); currentRequest = null; }
            /* 返回帧没有任何旧 :active 缩放；换回完整列表 DOM 后一次性定位，不做轮询纠正。 */
            var root = document.documentElement;
            root.classList.add('bfr');
            restorePjaxStyles(cached.styles);
            document.title = cached.title;
            current.parentNode.replaceChild(cached.main, current);
            jumpTo(typeof scrollY === 'number' ? scrollY : 0);
            if (horizontal) {
              document.querySelectorAll('.hot-scroll, .res-hot-scroll').forEach(function(el, i){
                var x = Number(horizontal[i]);
                if (isFinite(x)) el.scrollLeft = x;
              });
            }
            requestAnimationFrame(function(){ setTimeout(function(){ root.classList.remove('bfr'); }, 80); });
            return true;
          }
          function sameOrigin(url){ return url.origin === location.origin; }
          function eligible(link, e){
            if (!link || !link.matches('[data-pjax]') || e.defaultPrevented || e.button !== 0) return false;
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || link.target === '_blank' || link.hasAttribute('download')) return false;
            var url; try { url = new URL(link.href, location.href); } catch (_) { return false; }
            return sameOrigin(url) && url.hash === '';
          }
          function runScripts(root){
            root.querySelectorAll('script').forEach(function(old){
              var s = document.createElement('script');
              for (var i=0;i<old.attributes.length;i++) s.setAttribute(old.attributes[i].name, old.attributes[i].value);
              s.text = old.textContent;
              old.parentNode.replaceChild(s, old);
            });
          }
          function refreshHead(doc){
            document.querySelectorAll('style[data-aiym-pjax-style]').forEach(function(s){s.remove();});
            doc.head.querySelectorAll('style').forEach(function(style){
              var text = style.textContent || '';
              /* layout.html 的共享样式已经存在，只搬运文章/工具详情页的专属 head 样式。 */
              if (!/\.tool-|\.post-|\.json-|\.qr-/.test(text)) return;
              var copy = document.createElement('style'); copy.setAttribute('data-aiym-pjax-style',''); copy.textContent = text;
              document.head.appendChild(copy);
            });
          }
          function jumpTo(y){
            var root = document.documentElement;
            var old = root.style.scrollBehavior;
            root.style.scrollBehavior = 'auto';
            window.scrollTo({top:y, left:0, behavior:'auto'});
            root.scrollTop = y;
            document.body.scrollTop = y;
            root.style.scrollBehavior = old;
          }
          /* 横向推荐区不属于 window 滚动容器，PJAX 替换 main 后必须单独保存/恢复。 */
          function horizontalScroll(){
            var out = {};
            document.querySelectorAll('.hot-scroll, .res-hot-scroll').forEach(function(el, i){
              out[i] = el.scrollLeft || 0;
            });
            return out;
          }
          function restoreHorizontalScroll(values){
            if (!values) return;
            function apply(){
              document.querySelectorAll('.hot-scroll, .res-hot-scroll').forEach(function(el, i){
                var x = Number(values[i]);
                if (!isFinite(x)) return;
                el.scrollLeft = x;
              });
            }
            apply();
            /* 推荐区脚本可能异步替换自身节点；监听这段短窗口，等新节点出现后立即恢复。 */
            var root = document.querySelector('main#main-content');
            var observer = root && window.MutationObserver ? new MutationObserver(apply) : null;
            if (observer) {
              observer.observe(root, {childList:true, subtree:true});
              setTimeout(function(){ observer.disconnect(); }, 3500);
            }
            [80, 260, 600, 1000, 1800, 3000].forEach(function(delay){
              setTimeout(apply, delay);
            });
          }
          function horizontalKey(){ return '__aiym_pjax_hscroll_' + location.href; }
          function load(url, push, scrollY, returnScroll, returnHorizontal){
            if (currentRequest) currentRequest.abort();
            currentRequest = new AbortController();
            /* 请求期间不改变列表滚动位置；main 替换完成后，详情页一次性置顶，
               返回列表则恢复历史状态中的原滚动位置。
               不给 body 设置 aria-busy：通用样式会将 [aria-busy=true] 整页降至 .7 透明度，
               视觉上形成全页蒙层。 */
            return fetch(url, {credentials:'same-origin', signal:currentRequest.signal, headers:{'X-Requested-With':'pjax'}})
              .then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
              .then(function(html){
                var doc = new DOMParser().parseFromString(html, 'text/html');
                var next = doc.querySelector('main#main-content');
                var main = document.querySelector('main#main-content');
                if (!next || !main) throw new Error('PJAX main not found');
                /* 前进时保留当前真实列表 DOM；返回可原样换回，避免动态列表重新拉取闪烁。 */
                if (push) cacheCurrentPage(location.href, main);
                if (push) history.pushState({aiymPjax:true, scrollY:0, returnScroll:typeof returnScroll === 'number' ? returnScroll : 0, returnUrl:location.href}, '', url);
                refreshHead(doc);
                document.title = doc.title;
                var replacement = document.importNode(next, true);
                main.parentNode.replaceChild(replacement, main);
                main = replacement;
                /* main 容器复用，但内容已换页；允许前进详情播放一次进入效果。 */
                delete main.dataset.aiymMaterialized;
                runScripts(main);
                if (window.AIYMPjaxRefresh) window.AIYMPjaxRefresh();
                if (push) {
                  jumpTo(0);
                  /* 前进到详情才播放一次内容进入；返回列表走下面的瞬移恢复，不重演动画。 */
                  if (window.AIYMPageEnter) requestAnimationFrame(function(){ window.AIYMPageEnter(main); });
                } else {
                  /* 首页/资源列表会在替换后异步补卡片高度；恢复期间最多等待约 2.4s。
                     用户一开始滚动/触摸便立即撤销，既保证返回原位，也绝不和用户抢滚动。 */
                  var restoreY = typeof scrollY === 'number' ? scrollY : 0;
                  var cancelledRestore = false;
                  function cancelRestore(){
                    cancelledRestore = true;
                    window.removeEventListener('wheel', cancelRestore);
                    window.removeEventListener('touchstart', cancelRestore);
                    window.removeEventListener('pointerdown', cancelRestore);
                  }
                  if (restoreY > 0) {
                    window.addEventListener('wheel', cancelRestore, {passive:true});
                    window.addEventListener('touchstart', cancelRestore, {passive:true});
                    window.addEventListener('pointerdown', cancelRestore, {passive:true});
                  }
                  var restoreTries = 0;
                  var lastHeight = document.documentElement.scrollHeight;
                  var stablePasses = 0;
                  (function restoreWhenReady(){
                    if (cancelledRestore) return;
                    /* 首次定位必做；后续仅在异步补卡片确实把页面推离目标时才再校正。
                       不再把“已在正确位置”的页面每 150ms 强制 scrollTo 一次。 */
                    var currentY = window.scrollY || document.documentElement.scrollTop || 0;
                    if (restoreTries === 0 || Math.abs(currentY - restoreY) > 2) jumpTo(restoreY);
                    restoreTries++;
                    /* 列表仍在补高度时继续短暂观察；高度稳定后退出。 */
                    var height = document.documentElement.scrollHeight;
                    var canHold = (height - window.innerHeight) >= (restoreY - 2);
                    stablePasses = (canHold && height === lastHeight) ? stablePasses + 1 : 0;
                    lastHeight = height;
                    if (restoreY <= 0 || stablePasses >= 2 || restoreTries >= 16) {
                      cancelRestore();
                      return;
                    }
                    setTimeout(restoreWhenReady, 150);
                  })();
                  restoreHorizontalScroll(returnHorizontal);
                }
                currentRequest = null;
              })
              .catch(function(err){
                if (err.name !== 'AbortError') window.location.href = url;
              });
          }
          document.addEventListener('click', function(e){
            var link = e.target.closest && e.target.closest('a[data-pjax]');
            if (!eligible(link, e)) return;
            e.preventDefault();
            var fromScroll = window.scrollY || document.documentElement.scrollTop || 0;
            var fromHorizontal = horizontalScroll();
            try {
              sessionStorage.setItem('__aiym_pjax_scroll_' + location.href, String(fromScroll));
              sessionStorage.setItem(horizontalKey(), JSON.stringify(fromHorizontal));
            } catch (_) {}
            if (history.state && history.state.aiymPjax) history.replaceState(Object.assign({}, history.state, {scrollY:fromScroll, horizontalScroll:fromHorizontal}), '', location.href);
            load(link.href, true, 0, fromScroll, fromHorizontal);
          }, true);
          history.scrollRestoration = 'manual';
          history.replaceState(Object.assign({}, history.state || {}, {aiymPjax:true, scrollY:window.scrollY||0}), '', location.href);
          window.addEventListener('popstate', function(e){
            if (!e.state || !e.state.aiymPjax) return;
            var restore = typeof e.state.scrollY === 'number' ? e.state.scrollY : 0;
            var restoreHorizontal = e.state.horizontalScroll || null;
            try {
              var saved = parseFloat(sessionStorage.getItem('__aiym_pjax_scroll_' + location.href));
              if (isFinite(saved)) restore = saved;
              if (!restoreHorizontal) {
                var savedHorizontal = sessionStorage.getItem(horizontalKey());
                if (savedHorizontal) restoreHorizontal = JSON.parse(savedHorizontal);
              }
            } catch (_) {}
            if (restoreCachedPage(location.href, restore, restoreHorizontal)) return;
            load(location.href, false, restore, 0, restoreHorizontal);
          });
          window.addEventListener('pagehide', function(){
            if (history.state && history.state.aiymPjax) history.replaceState(Object.assign({}, history.state, {scrollY:window.scrollY||0}), '', location.href);
          });
        })();
        /* ===== 图片「不阻塞交互」优化(全局) =====
                    只补 HTML 未写的轻量属性，绝不调用 getBoundingClientRect(强制重排会卡主线程)。
                    · decoding=async: 解码不卡主线程
                    · fetchpriority=low: 懒加载图低优先拉取,不抢首屏/主交互
                    · onerror: 失败自动隐藏破图, 占位容器保留, 不影响交互
                    (loading=lazy 已在各模板 HTML 手动写好) */
                (function(){
                          function applyFor(img){
                            if (!img || img.tagName!=="IMG" || img.getAttribute("data-img-opt")) return;
                            img.setAttribute("data-img-opt","1");
                            if (!img.getAttribute("decoding")) img.setAttribute("decoding","async");
                            /* 文章正文/长内容里的图一律懒加载(滚到才拉)，详情页打开不一次并发 N 张 MinIO 图 */
                            if (!img.getAttribute("loading") && img.closest && img.closest(".post-content,.article-content,.content")){
                              img.setAttribute("loading","lazy");
                              img.setAttribute("fetchpriority","low");
                            }
                            if (!img.getAttribute("fetchpriority") && (img.getAttribute("loading")||"").toLowerCase()==="lazy")
                              img.setAttribute("fetchpriority","low");
                            if (!img.hasAttribute("data-no-fallback") && !img.getAttribute("onerror"))
                              img.setAttribute("onerror","this.classList.add('img-fallback');this.style.visibility='hidden';");
                          }
                  var scan=function(){ var img=document.images, i; for(i=0;i<img.length;i++) applyFor(img[i]); };
                  if (document.readyState==="loading") document.addEventListener("DOMContentLoaded",scan);
                  else scan();
                  /* 动态 JS 渲染的图补轻量属性 (无布局, 只写属性) */
                  if (typeof MutationObserver!=="undefined"){
                    new MutationObserver(function(ms){
                      var i,k,ad,targ;
                      for (i=0;i<ms.length;i++) for (k=0;k<ms[i].addedNodes.length;k++){
                        ad=ms[i].addedNodes[k];
                        if (ad&&ad.nodeType===1){
                          if (ad.tagName==="IMG") applyFor(ad);
                          else if (ad.querySelectorAll){ targ=ad.querySelectorAll("img"); var j; for(j=0;j<targ.length;j++) applyFor(targ[j]); }
                        }
                      }
                    }).observe(document.documentElement,{childList:true,subtree:true});
                  }
                })();
        </script>
        <halo:footer />
    </body>
    </html>
