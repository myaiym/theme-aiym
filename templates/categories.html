<!DOCTYPE html>
<html th:replace="~{layout :: html(head = null, content = ~{::content})}"
      xmlns:th="http://www.thymeleaf.org"
      lang="zh-CN">

<th:block th:fragment="content">
    <style>
    .categories { max-width: 1040px; margin: 0 auto; padding: 28px 0 60px; }
    .categories-hero { position: relative; min-height: 124px; padding: 27px 30px; overflow: hidden; border: 1px solid rgba(var(--color-brand-rgb), .20); border-radius: 18px; background: linear-gradient(120deg, var(--color-bg-secondary), rgba(var(--color-brand-rgb), .10) 72%, rgba(var(--color-brand-rgb), .18)); box-shadow: 0 10px 28px rgba(31,38,46,.045); }
    .categories-hero::after { content: '◫'; position: absolute; right: 29px; bottom: -34px; color: rgba(var(--color-brand-rgb), .14); font-size: 155px; font-weight: 750; line-height: 1; pointer-events: none; }
    .categories-hero__copy { position: relative; z-index: 1; }
    .categories-hero__kicker { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; color: var(--color-brand-text); font-size: 12px; font-weight: 700; letter-spacing: .05em; }
    .categories-hero__kicker::before { content: ''; width: 7px; height: 7px; border-radius: 3px; background: var(--color-brand); box-shadow: 0 0 0 5px rgba(var(--color-brand-rgb), .12); }
    .categories-title { margin: 0; color: var(--color-text-primary); font-size: 30px; font-weight: 750; letter-spacing: -.05em; line-height: 1.15; }
    .categories-subtitle { margin: 9px 0 0; color: var(--color-text-secondary); font-size: 13px; line-height: 1.65; }
    .categories-card { margin-top: 18px; padding: 22px; border: 1px solid var(--color-border-primary); border-radius: 16px; background: var(--color-bg-secondary); box-shadow: 0 3px 14px rgba(31,38,46,.035); }
    .categories-card__head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .categories-card__title { margin: 0; color: var(--color-text-primary); font-size: 15px; font-weight: 700; }
    .categories-card__count { margin: 0; color: var(--color-text-muted); font-size: 12px; }
    .categories-cloud { display: flex; flex-wrap: wrap; gap: 10px; }
    .category-chip { --category-hue: 204; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 7px 12px 7px 10px; border: 1px solid hsl(var(--category-hue) 72% 46% / .26); border-radius: 999px; color: hsl(var(--category-hue) 48% 26%); background: hsl(var(--category-hue) 88% 96%); font-size: 13px; font-weight: 600; line-height: 1; text-decoration: none; box-shadow: inset 0 1px rgba(255,255,255,.72); transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease; }
    .category-chip__mark { display: grid; width: 23px; height: 23px; place-items: center; border-radius: 50%; color: hsl(var(--category-hue) 58% 29%); background: hsl(var(--category-hue) 68% 58% / .20); font-size: 11px; font-weight: 750; }
    .category-chip__name { max-width: 164px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .category-chip__count { display: inline-grid; min-width: 18px; height: 18px; place-items: center; padding: 0 4px; border-radius: 99px; color: hsl(var(--category-hue) 55% 28%); background: hsl(var(--category-hue) 62% 68% / .20); font-size: 10px; font-variant-numeric: tabular-nums; }
    @media (hover: hover) { .category-chip:hover { transform: translateY(-2px); background: hsl(var(--category-hue) 80% 92%); box-shadow: 0 8px 18px hsl(var(--category-hue) 60% 38% / .16), inset 0 1px rgba(255,255,255,.8); } }
    .category-chip:focus-visible { outline: 3px solid var(--color-brand-glow); outline-offset: 2px; }
    .categories-empty { padding: 28px 16px; border: 1px dashed var(--color-border-primary); border-radius: 14px; color: var(--color-text-muted); text-align: center; }
    [data-theme="dark"] .categories-hero { background: linear-gradient(120deg, var(--color-bg-secondary), rgba(var(--color-brand-rgb), .13) 70%, rgba(var(--color-brand-rgb), .20)); }
    [data-theme="dark"] .category-chip { color: hsl(var(--category-hue) 88% 82%); background: hsl(var(--category-hue) 35% 17%); border-color: hsl(var(--category-hue) 62% 56% / .36); box-shadow: inset 0 1px rgba(255,255,255,.06); }
    [data-theme="dark"] .category-chip__mark, [data-theme="dark"] .category-chip__count { color: hsl(var(--category-hue) 90% 87%); background: hsl(var(--category-hue) 65% 64% / .20); }
    @media (max-width: 767px) { .categories { padding: 16px 0 28px; } .categories-hero { min-height: 112px; padding: 21px 18px; border-radius: 15px; } .categories-hero::after { right: 14px; bottom: -15px; font-size: 116px; } .categories-title { font-size: 25px; } .categories-subtitle { max-width: 255px; font-size: 12px; } .categories-card { margin-top: 12px; padding: 14px; border-radius: 13px; } .categories-card__head { margin-bottom: 12px; } .categories-cloud { gap: 8px; } .category-chip { min-height: 36px; gap: 7px; padding: 6px 10px 6px 8px; font-size: 12px; } .category-chip__mark { width: 21px; height: 21px; } .category-chip__name { max-width: 118px; } }
    </style>

    <div class="categories">
        <th:block th:with="allCategories=${categoryFinder.listAll()}">
            <header class="categories-hero">
                <div class="categories-hero__copy">
                    <p class="categories-hero__kicker">内容地图</p>
                    <h1 class="categories-title">分类</h1>
                    <p class="categories-subtitle">按主题浏览技术文章、资源与实操记录。</p>
                </div>
            </header>

            <section class="categories-card" aria-labelledby="categories-cloud-title" th:if="${not #lists.isEmpty(allCategories)}">
                <div class="categories-card__head">
                    <h2 class="categories-card__title" id="categories-cloud-title">全部分类</h2>
                    <p class="categories-card__count" th:text="${#lists.size(allCategories)} + ' 个主题'">0 个主题</p>
                </div>
                <div class="categories-cloud">
                    <a th:each="cat : ${allCategories}"
                       th:href="@{${cat.status?.permalink}}"
                       class="category-chip"
                       th:attr="data-category-name=${cat.spec.displayName}">
                        <span class="category-chip__mark" th:text="${#strings.substring(cat.spec.displayName, 0, 1)}">分</span>
                        <span class="category-chip__name" th:text="${cat.spec.displayName}">分类</span>
                        <span class="category-chip__count" th:text="${cat.postCount}">0</span>
                    </a>
                </div>
            </section>
            <div class="categories-empty" th:if="${#lists.isEmpty(allCategories)}">暂时还没有可浏览的分类。</div>
        </th:block>
    </div>

    <script>
    (function () {
        var palette = [198, 222, 252, 278, 310, 334, 356, 18, 154, 174];
        var used = {};
        document.querySelectorAll('.category-chip[data-category-name]').forEach(function (chip, index) {
            var value = chip.getAttribute('data-category-name') || String(index), hash = 0;
            for (var i = 0; i < value.length; i++) hash = ((hash << 5) - hash + value.charCodeAt(i)) | 0;
            var colorIndex = Math.abs(hash) % palette.length;
            while (used[colorIndex] && Object.keys(used).length < palette.length) colorIndex = (colorIndex + 1) % palette.length;
            used[colorIndex] = true;
            chip.style.setProperty('--category-hue', palette[colorIndex]);
        });
    })();
    </script>
</th:block>

</html>
