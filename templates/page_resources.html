<!DOCTYPE html>
<html th:replace="~{layout :: html(head = null, content = ~{::content})}"
      xmlns:th="http://www.thymeleaf.org"
      lang="zh-CN">

<th:block th:fragment="content">
    <style>
    .hero-icon { display: inline-flex; align-items: center; justify-content: center; width: 1.4em; height: 1.4em;
        margin-right: .12em; vertical-align: middle; line-height: 1; font-size: 1.02em; flex-shrink: 0;
        filter: drop-shadow(0 1px 1px rgba(0,0,0,.05)); text-align: center; }
    /* 与首页、工具箱共用 layout.html 的流式聚合页容器。 */
    .resources-page { width: 100%; max-width: none; margin: 0; padding: 28px 0 64px; }
    @media (min-width: 768px) { .resources-page { padding: 28px 0 80px; } }

    .res-hero { text-align: center; padding: 20px 0 0; margin-bottom: 8px; }
    .res-hero__title { font-size: var(--fs-page-title); font-weight: 700; margin-bottom: 4px; letter-spacing: -0.01em; }
    .res-hero__desc { font-size: var(--fs-card-desc); color: var(--color-text-muted); }

    @media (max-width: 767px) {
        .res-hero { padding: 10px 0 2px; margin-bottom: 2px; }
        .res-hero__title { font-size: 20px; margin-bottom: 2px; }
        .res-hero__desc { font-size: 11px; }
    }

    /* section-title */
    .res-section { padding: 8px 0 0; }
    .res-section-title {
        font-size: var(--fs-section-title); font-weight: 700; color: var(--color-text-primary);
        margin-bottom: 14px; padding: 0 4px; display: block;
    }
    /* 分类下划线已承担强调色职责，标题保持纯文字，避免两种蓝色装饰相撞。 */
    .res-section-title::before { display: none; }
    #res-rec .res-section-title::after { content: '左右滑动查看更多'; margin-left: 10px; font-size: 11px; font-weight: 500; color: var(--color-text-muted); vertical-align: 1px; }

    /* 卡片入场动画 */
    @keyframes resCardIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* 骨架屏拖拽占位圆角与真实卡片一致 */
    .res-skeleton-hot-card { border-radius: 20px !important; }
    .res-skeleton-card { border-radius: 16px !important; }

    /* 筛选栏（App商店下划线 tab） */
    .res-filter { display: flex; gap: 22px; overflow-x: auto; padding: 0 2px; margin: 4px 0 14px;
        scrollbar-width: none; position: sticky; top: var(--mobile-nav-height); z-index: 20;
        background: var(--color-bg-primary);
        scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
    .res-filter::-webkit-scrollbar { display: none; }
    .res-filter-chip {
        flex: 0 0 auto; position: relative; padding: 10px 2px; font-size: var(--fs-filter);
        color: var(--color-text-secondary); background: transparent; border: none; cursor: pointer;
        transition: color .25s cubic-bezier(.22,1,.36,1); white-space: nowrap; font-family: inherit;
        -webkit-tap-highlight-color: transparent; scroll-snap-align: start;
    }
    .res-filter-chip::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px;
        border-radius: 2px; background: var(--color-brand); transform: scaleX(0); transform-origin: center;
        transition: transform .28s cubic-bezier(.22,1,.36,1); }
    .res-filter-chip.active { color: var(--color-brand-text); font-weight: 600; }
    .res-filter-chip.active::after { transform: scaleX(1); }
    .res-filter-chip:active { opacity: .6; }

    /* 横滑 */
    .res-hot-scroll {
        display: flex; flex-wrap: nowrap; gap: 12px; overflow-x: auto; overflow-y: hidden;
        padding-bottom: 8px; scroll-snap-type: x proximity; scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y;
        scrollbar-width: none; cursor: grab; transform: translateZ(0); will-change: scroll-position;
    }
    .res-hot-scroll::-webkit-scrollbar { display: none; }
    .res-hot-scroll.is-dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; }

    .res-hot-card {
        flex-shrink: 0; width: 360px; background: var(--color-bg-secondary);
        border-radius: 20px; overflow: hidden;
        box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
        cursor: pointer; border: 1px solid var(--color-border-primary);
        transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s cubic-bezier(.34,1.56,.64,1), border-color .3s;
        scroll-snap-align: start;
    }
    .res-hot-card:active { transform: scale(.98); transition-duration: .1s; }
    @media (hover: hover) { .res-hot-card:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 18px 44px rgba(0,0,0,.10); border-color: var(--color-border-secondary); } }
    .res-hot-card a { text-decoration: none; color: inherit; display: block; }

    .res-hot-cover { width: 100%; height: 160px; overflow: hidden; background: var(--color-bg-tertiary); display: flex; align-items: center; justify-content: center; position: relative; }
    .res-hot-cover img { width: 100%; height: 100%; object-fit: cover; }
    .res-hot-cover-letter { font-size: 48px; font-weight: 800; color: rgba(255,255,255,0.85); text-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    .res-hot-bottom { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
    .res-hot-icon {
        width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center; overflow: hidden;
        background: linear-gradient(135deg, var(--color-brand), var(--color-brand-hover));
        box-shadow: 0 2px 10px rgba(66,165,245,.28);
    }
    .res-hot-icon img { width: 22px; height: 22px; }
    .res-hot-icon.no-bg { background: var(--color-bg-tertiary) !important; box-shadow: none; border-radius: 11px; }
    .res-hot-icon.no-bg img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
    .res-hot-icon-letter { font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.92); text-shadow: 0 1px 3px rgba(0,0,0,.18); }

    .res-hot-info { flex: 1; min-width: 0; overflow: hidden; }
    .res-hot-name { font-size: var(--fs-card-title); font-weight: 600; color: var(--color-text-primary); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .res-hot-desc { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; min-height: 16px; }

    .res-hot-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .res-hot-stats { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--color-text-secondary); }
    .res-hot-stat { display: inline-flex; align-items: center; gap: 3px; }

    /* 全部资源 */
    .res-tool-grid { display: grid; grid-template-columns: 1fr; gap: 8px; padding-bottom: 12px; }
    @media (min-width: 768px) { .res-tool-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
    .res-tool-card {
        display: flex; align-items: center; gap: 10px; padding: 12px 14px; min-width: 0;
        background: var(--color-bg-secondary); border-radius: 16px;
        border: 1px solid var(--color-border-primary);
        box-shadow: none; cursor: pointer;
        transition: transform .32s cubic-bezier(.34,1.56,.64,1), box-shadow .32s cubic-bezier(.34,1.56,.64,1), border-color .28s;
    }
    .res-tool-card:active { transform: scale(.98); transition-duration: .08s; }
    @media (hover: hover) { .res-tool-card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 14px 32px rgba(0,0,0,.09); border-color: var(--color-border-secondary); } }
    .res-tool-card a { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px; min-width: 0; width: 100%; }

    .res-tool-icon {
        width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center; overflow: hidden;
        background: linear-gradient(135deg, var(--color-brand), var(--color-brand-hover));
        box-shadow: 0 2px 8px rgba(66,165,245,.24);
    }
    .res-tool-icon img { width: 22px; height: 22px; }
    .res-tool-icon.no-bg { background: var(--color-bg-tertiary) !important; box-shadow: none; border-radius: 11px; }
    .res-tool-icon.no-bg img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
    .res-tool-icon-letter { font-size: 18px; font-weight: 800; color: rgba(255,255,255,0.92); text-shadow: 0 1px 3px rgba(0,0,0,.16); }

    .res-tool-info { flex: 1; min-width: 0; overflow: hidden; }
    .res-tool-name { font-size: var(--fs-card-title); font-weight: 600; color: var(--color-text-primary); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .res-tool-desc { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; min-height: 16px; }

    .res-tool-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .res-tool-tags { display: flex; gap: 3px; overflow: hidden; }
    .res-tool-tag { font-size: 10px; color: var(--color-brand-text); background: rgba(var(--color-brand-rgb), 0.08); padding: 2px 7px; border-radius: 7px; font-weight: 500; white-space: nowrap; }
    .res-tool-stats { display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 11px; color: var(--color-text-secondary); }
    .res-tool-stat { display: flex; align-items: center; gap: 3px; }

    .res-empty { text-align: center; padding: 48px 16px; color: var(--color-text-muted); }
    .res-empty-icon { width: 48px; height: 48px; margin: 0 auto 12px; color: var(--color-text-secondary); opacity: 0.65; }
    .res-empty-text { font-size: 14px; }

    /* 骨架屏（对齐真实卡片盒模型：边框/padding/尺寸与 .res-hot-card 和 .res-tool-card 一致，避免切换时跳变） */
    @keyframes resShimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    .res-skeleton { background: var(--color-bg-secondary); border-radius: 8px; }
    .res-skeleton-hot { display: flex; gap: 12px; overflow: hidden; }
    .res-skeleton-hot-card { flex-shrink: 0; width: 360px; background: var(--color-bg-secondary); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border-primary); box-sizing: border-box; }
    .res-skeleton-cover { width: 100%; height: 160px; background: linear-gradient(90deg, var(--color-bg-secondary) 25%, rgba(0,0,0,0.04) 50%, var(--color-bg-secondary) 75%); background-size: 800px 100%; animation: resShimmer 1.5s infinite; }
    .res-skeleton-bottom { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
    .res-skeleton-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(90deg, var(--color-bg-secondary) 25%, rgba(0,0,0,0.04) 50%, var(--color-bg-secondary) 75%); background-size: 800px 100%; animation: resShimmer 1.5s infinite; flex-shrink: 0; }
    .res-skeleton-lines { flex: 1; }
    .res-skeleton-bar { height: 12px; border-radius: 6px; margin-bottom: 6px; background: linear-gradient(90deg, var(--color-bg-secondary) 25%, rgba(0,0,0,0.04) 50%, var(--color-bg-secondary) 75%); background-size: 800px 100%; animation: resShimmer 1.5s infinite; }
    /* 竖条骨架与真实 .res-tool-card 对齐: padding 12px 14px + 边框 */
    .res-skeleton-card { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--color-bg-secondary); border-radius: 16px; border: 1px solid var(--color-border-primary); box-sizing: border-box; }
    .res-skeleton-card-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(90deg, var(--color-bg-secondary) 25%, rgba(0,0,0,0.04) 50%, var(--color-bg-secondary) 75%); background-size: 800px 100%; animation: resShimmer 1.5s infinite; flex-shrink: 0; }

    /* 弱动效：关闭卡片入场与弹性 */
    @media (prefers-reduced-motion: reduce) {
        .res-hot-card, .res-tool-card { animation: none !important; transition: none !important; }
        .res-skeleton-cover, .res-skeleton-icon, .res-skeleton-bar, .res-skeleton-card-icon { animation-duration: 2.4s !important; }
    }
    .res-skeleton-card-lines { flex: 1; }
    .res-skeleton-card-bar { height: 12px; border-radius: 6px; margin-bottom: 6px; background: linear-gradient(90deg, var(--color-bg-secondary) 25%, rgba(0,0,0,0.04) 50%, var(--color-bg-secondary) 75%); background-size: 800px 100%; animation: resShimmer 1.5s infinite; }

    @media (min-width: 768px) and (max-width: 1100px) and (max-height: 920px) {
        /* 手机桌面版的中等宽度/矮视口：保持所有资源可扫读，并让页脚仍留在首屏。 */
        .resources-page { padding: 10px 0 8px; }
        .res-hero { padding: 4px 0 0; margin-bottom: 0; }
        .res-hero__title { font-size: 23px; margin-bottom: 1px; }
        .res-hero__desc { font-size: 11px; }
        .res-filter { margin: 0 0 8px; }
        .res-filter-chip { padding: 7px 2px; }
        .res-section { padding-top: 2px; }
        .res-section-title { margin-bottom: 7px; font-size: 15px; }
        .res-hot-scroll { gap: 10px; padding-bottom: 4px; }
        .res-hot-card, .res-skeleton-hot-card { width: 214px; }
        .res-hot-cover, .res-skeleton-cover { height: 82px; }
        .res-hot-bottom { padding: 6px 8px; gap: 6px; }
        .res-hot-icon { width: 30px; height: 30px; border-radius: 9px; }
        .res-hot-icon img { width: 17px; height: 17px; }
        .res-hot-desc, .res-hot-right { display: none; }
        .res-hot-name { font-size: 12px; }
        .res-tool-grid { grid-template-columns: repeat(3, 1fr); gap: 7px; padding-bottom: 2px; }
        .res-tool-card { padding: 7px 8px; gap: 7px; border-radius: 12px; }
        .res-tool-icon { width: 30px; height: 30px; border-radius: 9px; }
        .res-tool-icon img { width: 17px; height: 17px; }
        .res-tool-desc, .res-tool-right { display: none; }
        .res-tool-name { font-size: 12px; }
    }

    @media (min-width: 768px) {
        /* 分类是内容内的二级控制，而不是第二个 header：与页面底色融合，仅保留当前项的轻量状态。 */
        .resources-page .res-filter {
            width: 100vw;
            margin-left: calc(50% - 50vw);
            min-height: 48px;
            top: 56px;
            margin-bottom: 18px;
            align-items: center;
            background: var(--color-bg-primary);
            padding-inline: max(20px, calc((100vw - min(1280px, 100vw)) / 2 + clamp(20px, 3vw, 40px)));
            box-sizing: border-box;

        }
        .resources-page .res-filter-chip {
            min-height: 34px;
            padding: 7px 12px;
            border-radius: 10px;
        }
        .resources-page .res-filter-chip::after { display: none; }
        .resources-page .res-filter-chip.active {
            background: rgba(255,255,255,.62);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.82), 0 1px 3px rgba(26,23,20,.07);
        }
        [data-theme="dark"] .resources-page .res-filter {
            background: var(--color-bg-primary);
        }
        [data-theme="dark"] .resources-page .res-filter-chip.active {
            background: rgba(255,255,255,.15);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 1px 3px rgba(0,0,0,.14);
        }
    }

    @media (max-width: 767px) {
        .page-content { padding: 0 8px; }
        /* 与首页统一：最后一块内容到页脚保持 50px，页脚到 Duck 栏由 layout 统一处理。 */
        .site-content { padding-bottom: 50px; }
        .resources-page { padding: 12px 0 0; }
        .res-hot-card, .res-tool-card { animation: none !important; }
        #res-rec .res-section-title::after { display: none; }
        /* 推荐横滑卡：移动端缩窄 + 右侧渐隐 → 一眼可滑动 */
        .res-hot-card, .res-skeleton-hot-card { width: 240px; }
        .res-hot-cover { height: 124px; }
        .res-skeleton-cover { height: 124px; }
        /* 移动端骨架底部与真实横滑卡同步收紧（padding 8px 11px, icon 34px） */
        .res-skeleton-hot-card .res-skeleton-bottom { padding: 8px 11px; gap: 6px; }
        .res-skeleton-hot-card .res-skeleton-icon { width: 34px; height: 34px; border-radius: 10px; }
        .res-hot-scroll {
            margin-right: 0; padding-right: 28px; flex-wrap: nowrap !important;
            -webkit-mask-image: linear-gradient(to right, #000 86%, transparent 98%);
            mask-image: linear-gradient(to right, #000 86%, transparent 98%);
        }
        /* 底部简化：卡变窄后隐藏次要信息，保证标题显示全 */
                .res-hot-bottom { padding: 8px 11px; gap: 6px; }
                .res-hot-icon { width: 34px; height: 34px; border-radius: 10px; }
                .res-hot-icon img { width: 18px; height: 18px; }
                .res-hot-desc { display: none; }
                .res-hot-stats { display: inline-flex; }
                .res-hot-stat { font-size: 10px; }
                .res-hot-name { font-size: 13px; }
    }
    </style>

    <div class="resources-page page-content">
        <!-- Hero -->
        <div class="res-hero">
            <h1 class="res-hero__title"><span class="hero-icon iconify" data-icon="ri-archive-line" aria-hidden="true"></span>资源中心</h1>
            <p class="res-hero__desc">精选工具、插件、教程，一键获取</p>
        </div>

        <!-- 分类筛选 -->
        <div class="res-filter" id="res-filter" role="tablist" aria-label="资源分类"></div>

        <!-- 推荐资源（含骨架屏） -->
        <section class="res-section" id="res-rec">
            <h2 class="res-section-title">推荐资源</h2>
            <div class="res-skeleton-hot">
                <div class="res-skeleton-hot-card"><div class="res-skeleton-cover"></div><div class="res-skeleton-bottom"><div class="res-skeleton-icon"></div><div class="res-skeleton-lines"><div class="res-skeleton-bar" style="width:70%"></div><div class="res-skeleton-bar" style="width:50%"></div></div></div></div>
                <div class="res-skeleton-hot-card"><div class="res-skeleton-cover"></div><div class="res-skeleton-bottom"><div class="res-skeleton-icon"></div><div class="res-skeleton-lines"><div class="res-skeleton-bar" style="width:65%"></div><div class="res-skeleton-bar" style="width:45%"></div></div></div></div>
                <div class="res-skeleton-hot-card"><div class="res-skeleton-cover"></div><div class="res-skeleton-bottom"><div class="res-skeleton-icon"></div><div class="res-skeleton-lines"><div class="res-skeleton-bar" style="width:75%"></div><div class="res-skeleton-bar" style="width:55%"></div></div></div></div>
            </div>
        </section>

        <!-- 全部资源（含骨架屏） -->
        <section class="res-section" id="res-all">
            <h2 class="res-section-title">全部资源</h2>
            <div class="res-tool-grid">
                <div class="res-skeleton-card"><div class="res-skeleton-card-icon"></div><div class="res-skeleton-card-lines"><div class="res-skeleton-card-bar" style="width:60%"></div><div class="res-skeleton-card-bar" style="width:80%"></div></div></div>
                <div class="res-skeleton-card"><div class="res-skeleton-card-icon"></div><div class="res-skeleton-card-lines"><div class="res-skeleton-card-bar" style="width:55%"></div><div class="res-skeleton-card-bar" style="width:70%"></div></div></div>
                <div class="res-skeleton-card"><div class="res-skeleton-card-icon"></div><div class="res-skeleton-card-lines"><div class="res-skeleton-card-bar" style="width:65%"></div><div class="res-skeleton-card-bar" style="width:75%"></div></div></div>
                <div class="res-skeleton-card"><div class="res-skeleton-card-icon"></div><div class="res-skeleton-card-lines"><div class="res-skeleton-card-bar" style="width:50%"></div><div class="res-skeleton-card-bar" style="width:65%"></div></div></div>
            </div>
        </section>
    </div>

    <!-- 随机图（与首页一致） -->
    <script th:inline="javascript">
    /*<![CDATA[*/
    var _resPhotoUrls = [];
    (function() {
        var allPhotos = /*[[${photoFinder != null ? #lists.toList(photoFinder.listAll()) : null}]]*/ [];
        if (allPhotos && allPhotos.length) {
            for (var i = 0; i < allPhotos.length; i++) {
                var p = allPhotos[i];
                if (p && p.spec && p.spec.url) _resPhotoUrls.push(p.spec.url);
            }
        }
    })();
    /*]]>*/
    </script>

    <script th:inline="javascript">
    /*<![CDATA[*/
    (function() {
        var resourceCat = /*[[${theme.config.content?.resourceCategory ?: ''}]]*/ '';
        var recCount = /*[[${theme.config.content?.recommendResourceCount ?: 6}]]*/ 6;
        var photoUrls = _resPhotoUrls;

        if (!resourceCat) {
            document.getElementById('res-filter') && document.getElementById('res-filter').remove();
            document.getElementById('res-rec') && document.getElementById('res-rec').remove();
            document.getElementById('res-all').innerHTML = '<div class="res-empty"><span class="res-empty-icon iconify" data-icon="ri-settings-3-line" aria-hidden="true"></span><div class="res-empty-text">请在后台「内容设置」中配置资源分类</div></div>';
            return;
        }

        var API = '/apis/api.content.halo.run/v1alpha1/';
        var CAT_API = '/apis/api.content.halo.run/v1alpha1/categories';
        var currentCat = '';
        var childCatNames = [];
        var currentPage = 1;
        var pageSize = 10;
        var loading = false;
        var noMore = false;

        function getIcon(p) {
            var a = p.metadata && p.metadata.annotations || {};
            return a['theme.aiym.fun/icon-url'] || a['iconUrl'] || '';
        }

        /* 随机封面（与首页一致） */
        function sha256Hash(str) {
            var h = 0;
            for (var i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
            return Math.abs(h);
        }
        function getRandomCover(seed) {
            if (!photoUrls || photoUrls.length === 0) return '';
            /* 同首页：2小时桶内固定，不同资源互不重复；跨桶随机换一批 */
            var bucket = Math.floor(Date.now() / 7200000);
            var key = 'res-cover-map:' + bucket;
            var map = null;
            try { var j = localStorage.getItem(key); map = j ? JSON.parse(j) : null; } catch(e) {}
            if (!map || !map.bySeed) { map = { bySeed: {}, used: {} }; }
            if (map.bySeed[seed] != null) return photoUrls[map.bySeed[seed]];
            var idx = -1;
            for (var n = 0; n < photoUrls.length; n++) { if (!map.used[n]) { idx = n; break; } }
            if (idx < 0) idx = Math.floor(Math.random() * photoUrls.length);
            map.bySeed[seed] = idx; map.used[idx] = true;
            try { localStorage.setItem(key, JSON.stringify(map)); } catch(e) {}
            return photoUrls[idx];
        }
        function getCover(p) {
            var cover = (p.spec && p.spec.cover) || '';
            return cover || getRandomCover(p.metadata.name) || '';
        }

        function getTagNames(tags) {
            if (!tags || !tags.length) return [];
            return tags.slice(0, 2).map(function(t) {
                if (t.spec && t.spec.displayName) return t.spec.displayName;
                var name = t.metadata && t.metadata.name || t.name || t || '';
                return name.replace(/^tag-/, '');
            });
        }

        /* ===== 分类筛选 ===== */
        function renderFilter(cats) {
            var el = document.getElementById('res-filter');
            if (!el) return;
            childCatNames = (cats || []).map(function(c) { return c.metadata.name; });
            var h = '<button type="button" role="tab" aria-selected="true" class="res-filter-chip active" data-cat="">全部</button>';
            (cats || []).forEach(function(c) {
                h += '<button type="button" role="tab" aria-selected="false" class="res-filter-chip" data-cat="'+c.metadata.name+'">'+c.spec.displayName+'</button>';
            });
            el.innerHTML = h;
            el.querySelectorAll('.res-filter-chip').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    el.querySelectorAll('.res-filter-chip').forEach(function(b){ b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
                    btn.classList.add('active');
                    btn.setAttribute('aria-selected', 'true');
                    currentCat = btn.getAttribute('data-cat');
                    currentPage = 1; noMore = false;
                    showResSkeleton();
                    loadResources(true);
                });
            });
        }

        /* ===== 展示骨架屏（切换分类时） ===== */
        function showResSkeleton() {
            var rec = document.getElementById('res-rec');
            var all = document.getElementById('res-all');
            if (rec) {
                rec.innerHTML =
                    '<h2 class="res-section-title">推荐资源</h2>' +
                    '<div class="res-skeleton-hot">' +
                    '<div class="res-skeleton-hot-card"><div class="res-skeleton-cover"></div><div class="res-skeleton-bottom"><div class="res-skeleton-icon"></div><div class="res-skeleton-lines"><div class="res-skeleton-bar" style="width:70%"></div><div class="res-skeleton-bar" style="width:50%"></div></div></div></div>' +
                    '<div class="res-skeleton-hot-card"><div class="res-skeleton-cover"></div><div class="res-skeleton-bottom"><div class="res-skeleton-icon"></div><div class="res-skeleton-lines"><div class="res-skeleton-bar" style="width:65%"></div><div class="res-skeleton-bar" style="width:45%"></div></div></div></div>' +
                    '<div class="res-skeleton-hot-card"><div class="res-skeleton-cover"></div><div class="res-skeleton-bottom"><div class="res-skeleton-icon"></div><div class="res-skeleton-lines"><div class="res-skeleton-bar" style="width:75%"></div><div class="res-skeleton-bar" style="width:55%"></div></div></div></div>' +
                    '</div>';
            }
            if (all) {
                all.innerHTML =
                    '<h2 class="res-section-title">全部资源</h2>' +
                    '<div class="res-tool-grid">' +
                    '<div class="res-skeleton-card"><div class="res-skeleton-card-icon"></div><div class="res-skeleton-card-lines"><div class="res-skeleton-card-bar" style="width:60%"></div><div class="res-skeleton-card-bar" style="width:80%"></div></div></div>' +
                    '<div class="res-skeleton-card"><div class="res-skeleton-card-icon"></div><div class="res-skeleton-card-lines"><div class="res-skeleton-card-bar" style="width:55%"></div><div class="res-skeleton-card-bar" style="width:70%"></div></div></div>' +
                    '<div class="res-skeleton-card"><div class="res-skeleton-card-icon"></div><div class="res-skeleton-card-lines"><div class="res-skeleton-card-bar" style="width:65%"></div><div class="res-skeleton-card-bar" style="width:75%"></div></div></div>' +
                    '<div class="res-skeleton-card"><div class="res-skeleton-card-icon"></div><div class="res-skeleton-card-lines"><div class="res-skeleton-card-bar" style="width:50%"></div><div class="res-skeleton-card-bar" style="width:65%"></div></div></div>' +
                    '</div>';
            }
        }

        /* ===== 推荐资源 ===== */
        function renderRec(posts) {
            var el = document.getElementById('res-rec');
            if (!el) return;
            if (!posts.length) { el.innerHTML = ''; return; }
            var h = '<h2 class="res-section-title">推荐资源</h2>';
            h += '<div class="res-hot-scroll">';
            posts.forEach(function(p) {
                var cover = getCover(p);
                var icon = getIcon(p);
                var title = p.spec && p.spec.title || '';
                var excerpt = p.status && p.status.excerpt || '';
                var href = p.status && p.status.permalink || '#';
                var visit = p.stats && p.stats.visit || 0;
                var comment = p.stats && p.stats.comment || 0;
                var hasImg = !!icon;
                h += '<div class="res-hot-card"><a data-pjax href="'+href+'">';
                h += '<div class="res-hot-cover">';
                if (cover) h += '<img src="'+cover+'" alt="">';
                else h += '<span class="res-hot-cover-letter">'+title.substring(0,1)+'</span>';
                h += '</div>';
                h += '<div class="res-hot-bottom">';
                h += '<div class="res-hot-icon'+(hasImg?' no-bg':'')+'">';
                if (icon) h += '<img src="'+icon+'" alt="">';
                else h += '<span class="res-hot-icon-letter">'+title.substring(0,1)+'</span>';
                h += '</div>';
                h += '<div class="res-hot-info">';
                h += '<span class="res-hot-name">'+title+'</span>';
                h += '<span class="res-hot-desc">'+(excerpt?excerpt.substring(0,40):'')+'</span>';
                h += '</div>';
                h += '<div class="res-hot-right">';
                h += '<div class="res-hot-stats">';
                h += '<span class="res-hot-stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'+visit+'</span>';
                h += '</div>';
                h += '</div></div></a></div>';
            });
            h += '</div>';
            el.innerHTML = h;
            /* 渲染后绑定拖拽 */
            initHotScrollDrag(el.querySelector('.res-hot-scroll'));
        }

        /* ===== 全部资源 ===== */
        function renderAll(posts, append) {
            var el = document.getElementById('res-all');
            if (!el) return;
            if (!append) {
                if (!posts.length) {
                    el.innerHTML = '<div class="res-empty"><span class="res-empty-icon iconify" data-icon="ri-inbox-line" aria-hidden="true"></span><div class="res-empty-text">暂无资源文章</div></div>';
                    return;
                }
                el.innerHTML = '<h2 class="res-section-title">全部资源</h2><div class="res-tool-grid" id="res-grid"></div><div id="res-load-hint" style="text-align:center;padding:16px;font-size:13px;color:var(--color-text-muted);"></div>';
            }
            var grid = document.getElementById('res-grid');
            if (!grid) return;
            posts.forEach(function(p) { grid.appendChild(buildToolCard(p)); });
        }
        function appendAll(posts) {
            var grid = document.getElementById('res-grid');
            if (!grid || !posts.length) return;
            posts.forEach(function(p) { grid.appendChild(buildToolCard(p)); });
        }
        function buildToolCard(p) {
            var icon = getIcon(p);
            var title = p.spec && p.spec.title || '';
            var excerpt = p.status && p.status.excerpt || '';
            var href = p.status && p.status.permalink || '#';
            var visit = p.stats && p.stats.visit || 0;
            var comment = p.stats && p.stats.comment || 0;
            var tagNames = getTagNames(p.tags || p.spec && p.spec.tags || []);
            var hasImg = !!icon;
            var div = document.createElement('div');
            div.className = 'res-tool-card';
            var h = '<a data-pjax href="'+href+'">';
            h += '<div class="res-tool-icon'+(hasImg?' no-bg':'')+'">';
            if (icon) h += '<img src="'+icon+'" alt="">';
            else h += '<span class="res-tool-icon-letter">'+title.substring(0,1)+'</span>';
            h += '</div>';
            h += '<div class="res-tool-info">';
            h += '<span class="res-tool-name">'+title+'</span>';
            h += '<span class="res-tool-desc">'+(excerpt?excerpt.substring(0,40):'')+'</span>';
            h += '</div>';
            h += '<div class="res-tool-right">';
            if (tagNames.length) {
                h += '<div class="res-tool-tags">';
                tagNames.forEach(function(t){ h += '<span class="res-tool-tag">'+t+'</span>'; });
                h += '</div>';
            }
            h += '<div class="res-tool-stats">';
            h += '<span class="res-tool-stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'+visit+'</span>';
            h += '<span class="res-tool-stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'+comment+'</span>';
            h += '</div>';
            h += '</div></a>';
            div.innerHTML = h;
            return div;
        }
        function updateLoadHint() {
            var hint = document.getElementById('res-load-hint');
            if (!hint) return;
            hint.innerHTML = noMore ? '— 到底啦 —' : '';
        }

        /* ===== 加载资源（分页） ===== */
        function loadResources(reset) {
            if (loading || noMore) return;
            loading = true;
            var catFilter = currentCat || resourceCat;
            var url = API+'posts?page='+currentPage+'&size='+pageSize+'&fieldSelector=spec.categories='+catFilter+'&sort=spec.publishTime,desc';
            fetch(url, {credentials:'same-origin'})
                .then(function(r){return r.json()})
                .then(function(d){
                    var items = d.items || [];
                    if (currentCat) {
                        items = items.filter(function(p) {
                            var cats = (p.spec && p.spec.categories || []).map(function(c) {
                                return c.metadata ? c.metadata.name : c;
                            });
                            return cats.indexOf(currentCat) !== -1;
                        });
                    }
                    if (reset) {
                        var rec = items.slice().sort(function(a,b){ return (b.stats&&b.stats.visit||0)-(a.stats&&a.stats.visit||0); }).slice(0, recCount);
                        renderRec(rec);
                        renderAll(items, false);
                    } else {
                        appendAll(items);
                    }
                    if (items.length < pageSize) noMore = true;
                    currentPage++;
                    loading = false;
                    updateLoadHint();
                })
                .catch(function(){
                    loading = false;
                    if (reset) {
                        document.getElementById('res-rec') && (document.getElementById('res-rec').innerHTML = '');
                        document.getElementById('res-all').innerHTML = '<div class="res-empty"><div class="res-empty-icon">❌</div><div class="res-empty-text">加载失败，请刷新重试</div></div>';
                    }
                });
        }

        /* 1. 加载子分类 */
        fetch(CAT_API+'?size=50', {credentials:'same-origin'})
            .then(function(r){return r.json()})
            .then(function(d){
                var allCats = d.items || [];
                var resRoot = allCats.find(function(c){ return c.metadata.name === resourceCat; });
                var childNames = (resRoot && resRoot.spec && resRoot.spec.children) || [];
                var children = allCats.filter(function(c){ return childNames.indexOf(c.metadata.name) !== -1; });
                renderFilter(children);
            })
            .catch(function(){});

        /* 2. 加载资源文章 */
        loadResources(true);

        /* 3. 无限滚动 observer */
        function setupSentinel() {
            var allEl = document.getElementById('res-all');
            if (!allEl) return;
            var old = document.getElementById('res-sentinel');
            if (old) old.remove();
            var sentinel = document.createElement('div');
            sentinel.id = 'res-sentinel';
            allEl.appendChild(sentinel);
            new IntersectionObserver(function(entries) {
                if (entries[0].isIntersecting && !loading && !noMore) loadResources(false);
            }, { rootMargin: '200px' }).observe(sentinel);
        }
        /* 首次加载后也挂 sentinel */
        var _origRenderAll = renderAll;
        renderAll = function(posts, append) {
            _origRenderAll(posts, append);
            if (!append) setupSentinel();
        };

        /* ===== 横滑拖拽（与首页 hot-scroll 一致）===== */
        function initHotScrollDrag(el) {
            if (!el) return;
            var down = false, moved = false, isMouse = false, startX = 0, startY = 0, baseScroll = 0;
            el.addEventListener('pointerdown', function(e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                down = true; moved = false;
                isMouse = (e.pointerType === 'mouse');
                startX = e.clientX; startY = e.clientY; baseScroll = el.scrollLeft;
                el.classList.add('is-dragging'); el.style.userSelect = 'none';
            });
            el.addEventListener('pointermove', function(e) {
                if (!down) return;
                var dx = e.clientX - startX, dy = e.clientY - startY;
                if (Math.abs(dx) > 5 && Math.abs(dx) > Math.abs(dy)) { moved = true; }
                /* 触屏交给浏览器原生滚动；仅鼠标拖动时手动滚动 */
                if (isMouse && moved) { el.scrollLeft = baseScroll - dx; }
            });
            function endDrag() {
                if (!down) return;
                down = false;
                el.classList.remove('is-dragging'); el.style.userSelect = '';
            }
            el.addEventListener('pointerup', endDrag);
            el.addEventListener('pointercancel', endDrag);
            el.addEventListener('dragstart', function(e) { e.preventDefault(); });
            /* 拖拽横向滑动后松手，会残留一个 click 误触卡片跳转 → 在捕获阶段拦截 */
            el.addEventListener('click', function(e) {
                if (moved) { e.preventDefault(); e.stopPropagation(); }
            }, true);
            /* 滚轮 */
            el.addEventListener('wheel', function(e) {
                var delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
                if (!delta) return;
                var maxScroll = el.scrollWidth - el.clientWidth;
                if (maxScroll <= 0) return;
                el.scrollLeft = Math.max(0, Math.min(maxScroll, el.scrollLeft + delta));
                e.preventDefault();
            }, { passive: false });
        }
    })();
    /*]]>*/
    </script>

        <!-- 返回顶部按钮 -->
        <button class="back-to-top" data-back-to-top aria-label="返回顶部">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
